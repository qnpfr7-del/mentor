<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fc;color:#263453;font:14px/1.55 system-ui,-apple-system,"Noto Sans KR",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0}button:disabled{opacity:.5;cursor:not-allowed}.layout{display:flex;min-height:100vh}.aside{width:232px;flex-shrink:0;background:#182748;color:#c8d3ed;padding:28px 18px;display:flex;flex-direction:column}.brand{font-size:19px;color:white;font-weight:800;margin:0 0 40px}.brand small{display:block;font-size:10px;font-weight:400;color:#9aabd0;margin-top:4px}.mark{background:#7670e3;color:#fff;border-radius:10px;padding:7px 10px;margin-right:7px}.nav{display:grid;gap:7px}.nav button{color:#c1cde7;background:transparent;text-align:left;border-radius:10px;padding:12px 13px;font-weight:600}.nav button.on,.nav button:hover{background:#33446e;color:#fff}.footnote{margin-top:auto;font-size:11px;padding:14px;border-radius:12px;background:#283a60;line-height:1.8}.body{flex:1;min-width:0}.top{height:73px;padding:0 34px;background:#fff;border-bottom:1px solid #e8ecf4;display:flex;justify-content:space-between;align-items:center;gap:10px}.top b{font-size:12px;color:#7f8ea4}.top select{padding:10px;border:1px solid #e3e7f2;border-radius:10px;background:#fafbff;max-width:220px;min-width:0}.demo{font-size:11px;font-weight:800;color:#896721;background:#fff2d5;padding:5px 9px;border-radius:20px}.main{padding:28px 34px;max-width:1280px;margin:auto}.alert{background:#fff9e9;color:#79662d;border:1px solid #f0e2b6;padding:11px 15px;border-radius:11px;font-size:12px;margin-bottom:25px;line-height:1.7}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px;gap:12px}.eyebrow{font-size:11px;color:#746ddd;letter-spacing:1.7px;font-weight:800}.head h1{font-size:27px;line-height:1.3;letter-spacing:-1px;margin:8px 0}.muted{color:#8794aa;font-size:12px;margin:3px 0}.btn{display:inline-flex;align-items:center;justify-content:center;border-radius:10px;background:#5852d5;color:#fff;font-weight:750;padding:11px 15px;font-size:12px}.btn.outline{background:#fff;color:#5552c0;border:1px solid #dcdff3}.btn.light{background:#f0effd;color:#5552c0}.btn.danger{background:#fff1f3;color:#af5368}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:20px 0 28px}.stat,.card,.panel,.item{background:#fff;border:1px solid #e7ebf3;border-radius:15px;box-shadow:0 8px 25px #21345705}.stat{padding:19px 22px}.stat small{color:#8d9aaf;font-size:11px}.stat strong{display:block;font-size:31px;margin-top:7px}.hero{padding:24px 29px;border-radius:17px;background:linear-gradient(115deg,#3a438e,#6c69df);color:#fff;margin-bottom:29px}.hero h2{font-size:21px;margin:7px 0}.hero p{max-width:590px;color:#dde1ff;font-size:12px;line-height:1.75}.section{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:20px 0 14px}.section h2{font-size:17px;margin:0}.section p{font-size:12px;color:#909db0;margin:4px 0}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{padding:20px}.card h3{margin:13px 0 7px;font-size:15px;line-height:1.55}.card p{font-size:12px;color:#8896aa;min-height:34px;line-height:1.7}.meta{display:flex;justify-content:space-between;align-items:center;gap:8px}.chip{display:inline-block;background:#eeedfc;color:#5851bf;border-radius:7px;font-size:11px;font-weight:750;padding:5px 9px}.chip.green{background:#e5f8ee;color:#368c66}.chip.amber{background:#fff0d7;color:#aa7b2c}.chip.gray{background:#eaf0f4;color:#7a889e}.cardfooter{border-top:1px solid #eff1f5;margin-top:12px;padding-top:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}.cardfooter small{font-size:11px;color:#9ba7b8}.recommend{display:inline-block;padding:6px 9px;border-radius:7px;background:#f5f1ff;color:#795bbb;font-size:11px;margin-top:8px}.panel{padding:24px;max-width:850px}.panel h2{font-size:19px;margin:0 0 13px}.form{display:grid;gap:17px}.form label{font-size:12px;color:#54617b;font-weight:700;display:grid;gap:7px}.form input,.form textarea,.form select,.search{border:1px solid #e1e6ef;background:white;border-radius:10px;padding:12px;width:100%;outline:0;color:#33405b}.form textarea{min-height:125px;resize:vertical}.search{max-width:500px;margin-bottom:16px}.list{display:grid;gap:12px}.item{padding:18px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}.item b{font-size:13px}.item small{display:block;font-size:11px;color:#93a0b4;margin-top:8px;line-height:1.6}.buttons{display:flex;gap:7px;flex-wrap:wrap}.chat{height:530px;display:flex;flex-direction:column;padding:0;overflow:hidden}.chatHeader{padding:17px 20px;border-bottom:1px solid #e9edf4;display:flex;justify-content:space-between;align-items:center}.messages{flex:1;overflow:auto;padding:20px;background:#f8f9fc;display:flex;flex-direction:column;gap:10px}.bubble{border-radius:12px 12px 12px 3px;padding:11px 14px;background:white;align-self:flex-start;max-width:80%;font-size:12px;line-height:1.8;white-space:pre-wrap;overflow-wrap:anywhere}.bubble.mine{background:#5c57d5;color:#fff;align-self:flex-end;border-radius:12px 12px 3px 12px}.send{display:flex;gap:8px;padding:15px;border-top:1px solid #e7eaf2}.send input{flex:1;border:1px solid #e2e7f0;border-radius:10px;padding:10px 12px;min-width:0}.pills{display:flex;gap:7px;flex-wrap:wrap}.pills button{background:#fff;border:1px solid #dfe5ef;color:#65728a;padding:9px 10px;border-radius:9px;font-size:12px}.pills button.on{background:#eeedff;color:#5750bd;border-color:#c2bdf4}.empty{padding:37px;text-align:center;color:#929eb1;border:1px dashed #dce3ee;border-radius:15px;background:#fff}.note{background:#f5f6fc;border-radius:10px;padding:14px;font-size:12px;color:#7a8699;line-height:1.8}.toolbar{display:flex;gap:10px}.toolbar select{padding:12px;border:1px solid #e1e6ef;border-radius:10px;background:#fff}.mobile{display:none}

@media(max-width:650px){.aside{display:none}.top{height:61px;padding:0 13px}.top b{display:none}.main{padding:19px 13px 85px}.head h1{font-size:22px}.head{align-items:start}.stats{gap:7px}.stat{padding:13px 12px}.stat strong{font-size:24px}.stat small{font-size:10px}.hero{padding:19px}.hero h2{font-size:18px}.item{display:block}.buttons{margin-top:12px}.mobile{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;background:#fff;border-top:1px solid #e4e9f3;padding:8px 2px 12px;z-index:5}.mobile button{background:none;color:#77819c;font-weight:700;font-size:11px;padding:7px}.mobile button.on{color:#5952cb}.chat{height:calc(100dvh - 230px);min-height:360px}.bubble{max-width:91%}}
</style></head><body><div id="app"></div><script>
(function(){
var key='civil-mentor-public-demo-1';var categories=['인사·복무','예산·회계','계약·지출','지방보조금','민원','복지','행정시스템','기타'];
function initial(){return {users:[{id:'admin',name:'김관리',dept:'총무과',roles:['admin'],approved:true,fields:[],exp:''},{id:'mentee',name:'이새롬',dept:'청년정책과',roles:['mentee'],approved:true,fields:[],exp:''},{id:'mentee2',name:'박지훈',dept:'복지정책과',roles:['mentee'],approved:true,fields:[],exp:''},{id:'mentor1',name:'정민수',dept:'예산팀',roles:['mentor'],approved:true,fields:['예산·회계','지방보조금','계약·지출'],exp:'지방보조금 교부 및 정산, 예산편성, 지출결의 업무 담당'},{id:'mentor2',name:'오하늘',dept:'인사팀',roles:['mentor'],approved:true,fields:['인사·복무','행정시스템'],exp:'인사발령, 초과근무, 복무관리, 새올시스템 업무 담당'},{id:'pending',name:'최다은',dept:'안전총괄과',roles:['mentor'],approved:false,fields:['민원'],exp:'민원 응대 업무'}],posts:[{id:'q1',by:'mentee',title:'지방보조금 정산 시 집행잔액 반납 방법은?',cat:'지방보조금',body:'사업 정산 보고서를 검토 중입니다. 집행잔액과 발생이자 처리 절차가 궁금합니다.',status:'open'},{id:'q2',by:'mentee2',title:'초과근무수당 신청 시 유의사항이 있나요?',cat:'인사·복무',body:'신규 발령을 받았습니다. 초과근무 등록과 승인 절차가 궁금합니다.',status:'open'},{id:'q3',by:'mentee',title:'e호조에서 지출결의서 작성하는 방법',cat:'예산·회계',body:'처음 지출결의서를 작성하게 되었습니다. 기본 작성 흐름이 궁금합니다.',status:'matched'},{id:'q4',by:'mentee2',title:'사회보장급여 민원 안내는 어떻게 하나요?',cat:'복지',body:'신청 절차와 주민에게 안내할 기본 사항을 알고 싶습니다.',status:'open'}],matches:[{id:'m1',pid:'q1',mentor:'mentor1',status:'applied'},{id:'m2',pid:'q3',mentor:'mentor1',status:'active'}],messages:[{match:'m2',by:'mentee',text:'안녕하세요! e호조 지출결의서 작성이 처음이라 문의드려요.'},{match:'m2',by:'mentor1',text:'반갑습니다! 먼저 지출 유형과 예산과목을 확인하고 증빙서류를 준비하면 좋습니다. 실제 처리는 최신 내부 지침을 확인하세요.'}]}}
var d;try{d=JSON.parse(localStorage.getItem(key))||initial()}catch(e){d=initial()}
var ui={user:'mentee',page:'home',selected:null,search:'',field:'전체'};function save(){localStorage.setItem(key,JSON.stringify(d))}save();
function find(id){return d.users.find(function(x){return x.id===id})}function me(){return find(ui.user)}function post(id){return d.posts.find(function(x){return x.id===id})}function role(r){return me().roles.indexOf(r)>=0}function apps(id){return d.matches.filter(function(m){return m.pid===id})}
function esc(x){return String(x==null?'':x).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function button(text,act,id,cl,disable){return '<button class="btn '+(cl||'')+'" data-act="'+act+'" data-id="'+esc(id||'')+'" '+(disable?'disabled':'')+'>'+text+'</button>'}
function status(s){return s==='open'?'<span class="chip green">멘토 모집 중</span>':s==='matched'?'<span class="chip amber">진행 중</span>':'<span class="chip gray">완료</span>'}
function rel(p){if(!role('mentor'))return 0;var u=me(),q=(p.title+' '+p.body+' '+p.cat).split(/[\s,]+/),words=(u.exp+' '+u.fields.join(' ')).split(/[\s,]+/);return (u.fields.indexOf(p.cat)>=0?60:0)+Math.min(35,q.filter(function(w){return w.length>1&&words.some(function(x){return x.length>1&&(x.indexOf(w)>=0||w.indexOf(x)>=0)})}).length*9)}
function questions(){return d.posts.filter(function(p){return (p.status==='open'||p.by===ui.user)&&(!ui.search||(p.title+p.body+p.cat).toLowerCase().indexOf(ui.search.toLowerCase())>=0)&&(ui.field==='전체'||p.cat===ui.field)}).sort(function(a,b){return role('mentor')?rel(b)-rel(a):d.posts.indexOf(a)-d.posts.indexOf(b)})}
function card(p){var done=apps(p.id).some(function(m){return m.mentor===ui.user});var own=p.by===ui.user;return '<div class="card"><div class="meta"><span class="chip">'+esc(p.cat)+'</span>'+status(p.status)+'</div><h3>'+esc(p.title)+'</h3><p>'+esc(p.body)+'</p>'+(role('mentor')&&rel(p)?'<span class="recommend">✦ 업무경험 연관 질문 · 추천 참고용</span>':'')+'<div class="cardfooter"><small>'+esc(find(p.by)?.name||'회원')+' · 신청 '+apps(p.id).length+'명</small>'+(role('mentor')&&!own&&p.status==='open'?button(done?'신청 완료':'멘토 신청','apply',p.id,'outline',done):button('자세히','detail',p.id,'outline'))+'</div></div>'}
function heading(title,sub,action){return '<div class="head"><div><div class="eyebrow">MENTOR BRIDGE</div><h1>'+title+'</h1><p class="muted">'+sub+'</p></div>'+(action||'')+'</div>'}
function nav(){var arr=[['home','⌂ 홈'],['questions','▤ 질문 둘러보기'],['matches','◉ 내 멘토링'],['profile','▣ 업무경험 관리'],['register','＋ 가입 신청 시연']];if(role('admin'))arr.push(['admin','✓ 승인 관리']);return arr.map(function(x){return '<button data-page="'+x[0]+'" class="'+(ui.page===x[0]?'on':'')+'">'+x[1]+'</button>'}).join('')}
function shell(){return '<div class="layout"><aside class="aside"><div class="brand"><span class="mark">✦</span>온보딩 메이트<small>공무원 업무 멘토링</small></div><div class="nav">'+nav()+'</div><div class="footnote">💡 서버 미연결 시연판<br>계정 전환을 통해 멘토·멘티·관리자 화면을 확인할 수 있습니다.</div></aside><div class="body"><header class="top"><b>공직 멘토링 / 시연 홈페이지</b><div style="display:flex;align-items:center;gap:9px"><span class="demo">DEMO</span><select id="person">'+d.users.filter(function(u){return u.approved}).map(function(u){return '<option value="'+u.id+'" '+(u.id===ui.user?'selected':'')+'>'+esc(u.name)+' · '+esc(u.roles.join('/'))+'</option>'}).join('')+'</select></div></header><main class="main"><div class="alert"><b>시연 모드</b> · 현재 브라우저에서만 데이터가 저장됩니다. 관리자 승인 및 채팅은 실제 서버 기능이 아닙니다. 개인정보나 비공개 업무자료를 입력하지 마세요.</div>'+screen()+'</main></div><nav class="mobile">'+[['home','⌂ 홈'],['questions','▤ 질문'],['matches','◉ 대화'],['profile','▣ 내 정보'],[role('admin')?'admin':'register',role('admin')?'✓ 관리':'＋ 가입']].map(function(x){return '<button class="'+(ui.page===x[0]?'on':'')+'" data-page="'+x[0]+'">'+x[1]+'</button>'}).join('')+'</nav></div>'}
function home(){return heading(esc(me().name)+'님, 오늘도 함께 성장해요.','모르는 업무는 선배의 경험과 연결해 보세요.',role('mentee')?button('＋ 질문 등록','go','new'):role('admin')?button('승인 관리','go','admin'):button('추천 질문 보기','go','questions'))+'<div class="stats"><div class="stat"><small>등록된 질문</small><strong>'+d.posts.length+'</strong></div><div class="stat"><small>멘토 모집 중</small><strong>'+d.posts.filter(function(p){return p.status==='open'}).length+'</strong></div><div class="stat"><small>내 진행 중 멘토링</small><strong>'+d.matches.filter(function(m){return m.status==='active'&&(m.mentor===ui.user||post(m.pid)?.by===ui.user)}).length+'</strong></div></div><div class="hero"><div style="font-size:10px;letter-spacing:2px">KNOWLEDGE CONNECTS PEOPLE</div><h2>처음이라 어려운 업무, 함께라면 쉬워집니다.</h2><p>신규 공무원의 질문과 선배 공무원의 과거 업무경험을 비교하여 관련 질문을 우선 표시합니다. 아직 외부 AI 서비스는 연결되지 않았습니다.</p></div><div class="section"><div><h2>'+(role('mentor')?'✦ 내 업무경험에 맞는 추천 질문':'최근 멘토링 질문')+'</h2><p>업무 분야·키워드를 기반으로 정렬한 질문입니다.</p></div>'+button('전체 보기 →','go','questions','outline')+'</div><div class="cards">'+questions().slice(0,4).map(card).join('')+'</div>'}
function listQuestions(){return heading('업무 질문 둘러보기',role('mentor')?'내 경력과 관련된 질문을 먼저 보여줍니다.':'질문을 검색하거나 멘토를 신청해 보세요.',role('mentee')?button('＋ 질문 등록','go','new'):'')+'<div class="toolbar"><input class="search" id="search" placeholder="업무 질문 검색" value="'+esc(ui.search)+'"><select id="cat"><option>전체</option>'+categories.map(function(c){return '<option '+(c===ui.field?'selected':'')+'>'+c+'</option>'}).join('')+'</select></div><div class="cards" id="cards">'+(questions().map(card).join('')||'<div class="empty">조건에 맞는 질문이 없습니다.</div>')+'</div>'}
function newQuestion(){if(!role('mentee'))return '<div class="empty">멘티 계정으로 전환해 주세요.</div>';return heading('새로운 멘토링 질문','분야를 선택하고 질문을 작성해 주세요.')+'<div class="panel"><form class="form" id="postForm"><label>업무 분야<select name="cat">'+categories.map(function(c){return '<option>'+c+'</option>'}).join('')+'</select></label><label>질문 제목<input required maxlength="120" name="title" placeholder="지방보조금 정산 절차가 궁금합니다"></label><label>질문 내용<textarea required name="body" maxlength="3000" placeholder="구체적인 업무 상황을 입력해 주세요."></textarea></label><div class="note">개인정보, 주민등록번호, 비공개 행정 문서와 비밀번호는 입력하지 마세요.</div><div><button class="btn" type="submit">질문 등록하기</button></div></form></div>'}
function detail(){var p=post(ui.selected);if(!p)return '<div class="empty">질문을 찾을 수 없습니다.</div>';var owner=p.by===ui.user;return heading(esc(p.title),esc(p.cat)+' · '+esc(find(p.by)?.name))+'<div class="panel"><p style="white-space:pre-wrap;line-height:1.9">'+esc(p.body)+'</p><hr style="border:0;border-top:1px solid #eef0f5;margin:22px 0"><h2>멘토 신청 현황</h2>'+(owner?apps(p.id).map(function(m){return '<div class="item"><div><b>'+esc(find(m.mentor)?.name)+' · '+esc(find(m.mentor)?.dept)+'</b><small>'+esc(find(m.mentor)?.exp)+'</small></div><div class="buttons">'+(m.status==='applied'&&p.status==='open'?button('이 멘토 선택','choose',m.id):m.status==='active'?button('채팅 열기','chat',m.id):'<span class="chip gray">'+m.status+'</span>')+'</div></div>'}).join('')||'<div class="empty">아직 신청한 멘토가 없습니다.</div>':role('mentor')&&p.status==='open'?button('멘토 신청하기','apply',p.id):'<p class="muted">매칭된 당사자만 상담을 진행합니다.</p>')+'</div>'}
function matches(){var ms=d.matches.filter(function(m){return m.mentor===ui.user||post(m.pid)?.by===ui.user});return heading('내 멘토링','신청과 매칭 상태를 확인하고 대화할 수 있습니다.')+'<div class="list">'+(ms.map(function(m){return '<div class="item"><div><span class="chip '+(m.status==='active'?'green':'amber')+'">'+(m.status==='active'?'진행 중':m.status==='applied'?'신청 대기':m.status==='completed'?'완료':'신청 마감')+'</span><b style="display:block;margin-top:8px">'+esc(post(m.pid)?.title)+'</b><small>멘토 '+esc(find(m.mentor)?.name)+' · 멘티 '+esc(find(post(m.pid)?.by)?.name)+'</small></div><div class="buttons">'+(m.status==='active'?button('채팅 열기','chat',m.id):m.status==='applied'&&post(m.pid)?.by===ui.user&&post(m.pid)?.status==='open'?button('멘토 선택','choose',m.id):'')+'</div></div>'}).join('')||'<div class="empty">등록된 멘토링이 없습니다.</div>')+'</div>'}
function chat(){var m=d.matches.find(function(x){return x.id===ui.selected});if(!m||m.status!=='active'||!(m.mentor===ui.user||post(m.pid)?.by===ui.user))return '<div class="empty">접근할 수 없는 채팅방입니다.</div>';return heading('멘토링 채팅 시연','계정 전환 후 같은 대화방을 열어 답장할 수 있습니다.')+'<div class="panel chat"><div class="chatHeader"><div><b>'+esc(post(m.pid)?.title)+'</b><div class="muted">'+esc(find(m.mentor)?.name)+' 멘토 · '+esc(find(post(m.pid)?.by)?.name)+' 멘티</div></div>'+(post(m.pid).by===ui.user?button('상담 완료','finish',m.id,'outline'):'')+'</div><div class="messages" id="messages">'+d.messages.filter(function(x){return x.match===m.id}).map(function(x){return '<div class="bubble '+(x.by===ui.user?'mine':'')+'">'+esc(x.text)+'</div>'}).join('')+'</div><form class="send" id="messageForm"><input required name="text" maxlength="2000" autocomplete="off" placeholder="메시지 입력"><button class="btn" type="submit">보내기 →</button></form></div>'}
function profile(){return heading('내 업무경험 관리','등록한 업무를 기준으로 질문 추천 순서가 달라집니다.')+'<div class="panel"><div class="note" style="margin-bottom:20px"><b>'+esc(me().name)+' · '+esc(me().dept)+'</b><br>시연 계정의 경력 정보를 수정할 수 있습니다.</div><form class="form" id="profileForm"><label>경험 업무 분야</label><div class="pills">'+categories.map(function(c){return '<button type="button" class="'+(me().fields.indexOf(c)>=0?'on':'')+'" data-act="toggle" data-id="'+esc(c)+'">'+c+'</button>'}).join('')+'</div><label>상세 경험<textarea name="exp">'+esc(me().exp)+'</textarea></label><div><button class="btn" type="submit">저장하기</button></div></form></div>'}
function register(){return heading('회원가입 신청 시연','가입 신청 후 관리자 계정에서 승인해 보세요.')+'<div class="panel"><form id="signup" class="form"><label>이름<input required name="name" maxlength="30" placeholder="홍길동"></label><label>소속 부서<input required name="dept" maxlength="50" placeholder="행정지원과"></label><label>역할<select name="role"><option value="mentee">멘티</option><option value="mentor">멘토</option><option value="both">멘토 겸 멘티</option></select></label><label>업무경험 분야<select name="field"><option value="">선택 안 함</option>'+categories.map(function(c){return '<option>'+c+'</option>'}).join('')+'</select></label><label>상세 업무경험<textarea name="exp" placeholder="예: 인사·복무 업무 3년"></textarea></label><div class="note">실제 회원 인증·비밀번호 저장 없이 승인 흐름만 시연합니다.</div><button class="btn" type="submit">가입 승인 신청하기</button></form></div>'}
function admin(){if(!role('admin'))return '<div class="empty">관리자 계정 전용입니다.</div>';var p=d.users.filter(function(x){return !x.approved&&!x.rejected});return heading('관리자 승인 관리','이름과 부서를 확인해 가입 요청을 승인하거나 반려합니다.')+'<div class="list">'+(p.map(function(u){return '<div class="item"><div><b>'+esc(u.name)+' · '+esc(u.dept)+'</b><small>'+esc(u.roles.join(','))+' · '+esc(u.exp)+'</small></div><div class="buttons">'+button('반려','reject',u.id,'danger')+button('승인','approve',u.id)+'</div></div>'}).join('')||'<div class="empty">승인 대기 중인 회원이 없습니다.</div>')+'</div>'}
function screen(){return {home:home,questions:listQuestions,new:newQuestion,detail:detail,matches:matches,chat:chat,profile:profile,register:register,admin:admin}[ui.page]()}
function render(){document.getElementById('app').innerHTML=shell();var m=document.getElementById('messages');if(m)m.scrollTop=m.scrollHeight}
function go(page,id){ui.page=page;ui.selected=id||null;render()}
function act(type,id){var p=post(id),m=d.matches.find(function(x){return x.id===id});if(type==='go')return go(id);if(type==='detail')return go('detail',id);if(type==='apply'){if(!role('mentor')||!p||p.status!=='open'||p.by===ui.user||apps(id).some(function(x){return x.mentor===ui.user}))return alert('신청할 수 없습니다.');d.matches.push({id:'m'+Date.now(),pid:id,mentor:ui.user,status:'applied'});save();render();alert('멘토 신청 완료!')}if(type==='choose'&&m&&post(m.pid)?.by===ui.user&&post(m.pid).status==='open'){m.status='active';post(m.pid).status='matched';d.matches.forEach(function(x){if(x.pid===m.pid&&x.id!==m.id)x.status='rejected'});save();go('chat',m.id)}if(type==='chat')go('chat',id);if(type==='finish'&&m&&post(m.pid)?.by===ui.user){m.status='completed';post(m.pid).status='closed';save();go('matches')}if(type==='toggle'){var f=me().fields;me().fields=f.includes(id)?f.filter(function(x){return x!==id}):f.concat(id);save();render()}if((type==='approve'||type==='reject')&&role('admin')){var u=find(id);if(u){u.approved=type==='approve';u.rejected=type==='reject';save();render()}}}
document.addEventListener('click',function(e){var t=e.target.closest('[data-page],[data-act]');if(!t)return;if(t.dataset.page)go(t.dataset.page);else act(t.dataset.act,t.dataset.id)});
document.addEventListener('change',function(e){if(e.target.id==='person'){ui.user=e.target.value;ui.page='home';ui.selected=null;render()}if(e.target.id==='cat'){ui.field=e.target.value;render()}});
document.addEventListener('input',function(e){if(e.target.id==='search'){ui.search=e.target.value;document.getElementById('cards').innerHTML=questions().map(card).join('')||'<div class="empty">검색 결과가 없습니다.</div>'}});
document.addEventListener('submit',function(e){e.preventDefault();var fd=new FormData(e.target),f=e.target.id;if(f==='postForm'&&role('mentee')){d.posts.unshift({id:'q'+Date.now(),by:ui.user,title:String(fd.get('title')).trim(),body:String(fd.get('body')).trim(),cat:fd.get('cat'),status:'open'});save();go('questions')}if(f==='signup'){d.users.push({id:'u'+Date.now(),name:String(fd.get('name')).trim(),dept:String(fd.get('dept')).trim(),roles:fd.get('role')==='both'?['mentor','mentee']:[fd.get('role')],approved:false,fields:fd.get('field')?[fd.get('field')]:[],exp:String(fd.get('exp')||'')});save();go('home');alert('가입 신청 완료! 관리자 계정으로 전환해 승인해 보세요.')}if(f==='profileForm'){me().exp=String(fd.get('exp')||'');save();render();alert('저장했습니다.')}if(f==='messageForm'){var m=d.matches.find(function(x){return x.id===ui.selected});if(m&&m.status==='active'&&(m.mentor===ui.user||post(m.pid)?.by===ui.user)){d.messages.push({match:m.id,by:ui.user,text:String(fd.get('text')||'').trim()});save();render()}}});
render();
})();
</script></body></html>
