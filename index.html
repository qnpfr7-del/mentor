const defaults={questions:[{id:1,title:'지방보조금 정산, 집행잔액은 어떻게 처리하나요?',body:'처음으로 보조사업 정산을 맡았습니다. 집행잔액과 발생이자의 반납 절차가 궁금해요.',category:'예산·회계',author:'하늘주사',dept:'문화예술과',tags:['보조금','정산'],status:'모집 중',applicants:[],date:'오늘',mine:false},{id:2,title:'e호조 지출결의부터 지급까지, 흐름이 궁금해요.',body:'지출결의를 올리기 전에 확인해야 할 서류와 시스템 처리 순서를 배우고 싶습니다.',category:'예산·회계',author:'차근차근',dept:'복지정책과',tags:['e호조','지출결의'],status:'모집 중',applicants:[],date:'오늘',mine:false},{id:3,title:'청년 프로그램, 참여자 모집은 어떻게 시작하시나요?',body:'첫 프로그램을 기획하고 있어요. 모집 홍보 채널과 신청 관리 방법에 대한 경험을 듣고 싶어요.',category:'사업·기획',author:'기획하는달',dept:'일자리정책과',tags:['청년','프로그램'],status:'모집 중',applicants:[],date:'어제',mine:false},{id:4,title:'계약 업무가 처음인데 수의계약 절차가 궁금합니다.',body:'견적서 요청부터 계약 체결까지 준비해야 하는 자료가 궁금합니다.',category:'계약·지출',author:'김서연',dept:'청년정책과',tags:['계약','수의계약'],status:'모집 중',applicants:['든든선배','회계요정'],date:'어제',mine:true}],profile:{name:'김서연',dept:'청년정책과',tags:'보조금, 정산, e호조, 청년, 프로그램',experience:'청년지원 사업 기획과 지방보조금 교부·정산 업무를 담당했습니다.',available:true},members:[{name:'윤지호',dept:'행정지원과',role:'멘티',status:'승인 대기'},{name:'한수빈',dept:'세무과',role:'멘토·멘티',status:'승인 대기'}],rooms:[{id:100,title:'예산편성 절차가 궁금해요',mentor:'든든선배',messages:[{who:'mentor',text:'안녕하세요, 서연님! 예산편성 업무를 담당했던 든든선배입니다. 어떤 부분이 궁금하신가요?'},{who:'me',text:'안녕하세요! 사업 예산을 처음 편성하게 돼서 전체 흐름부터 여쭤보고 싶어요.'},{who:'mentor',text:'좋아요. 지금 준비 중인 사업의 개요와 궁금한 점을 말씀해 주세요.'}],closed:false}]};let db;try{db=JSON.parse(localStorage.getItem('jusa-portal-design-v1'))||structuredClone(defaults)}catch{db=structuredClone(defaults)}let page='home',filter='전체',query='',roomId=100;const categories=['전체','예산·회계','계약·지출','인사·복무','사업·기획','민원·복지'];function save(){localStorage.setItem('jusa-portal-design-v1',JSON.stringify(db))}function toast(s){$('#toast').className='toast';$('#toast').textContent=s;setTimeout(()=>{$('#toast').className='';$('#toast').textContent=''},3000)}function modal(html){$('#overlay').innerHTML=`<div class="modalback"><section role="dialog" aria-modal="true" class="modal"><button class="close" aria-label="닫기" onclick="closeModal()">×</button>${html}</section></div>`;$('#overlay input, #overlay textarea, #overlay button')?.focus()}function closeModal(){$('#overlay').innerHTML=''}document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});function go(p){page=p;filter='전체';query='';render()}function score(q){let terms=db.profile.tags.split(/[,\s]+/).filter(Boolean);let hits=terms.filter(t=>(q.title+q.body+q.category+q.tags.join(' ')).includes(t));return {value:hits.length,hits}}function card(q){let s=score(q);return `<button class="card" onclick="detail(${q.id})"><div class="cardtop"><div><span class="tag">${esc(q.category)}</span> ${s.value?'<span class="tag ai">✧ 경험 기반 추천</span>':''}</div><span class="${q.status==='모집 중'?'status':'tag'}">${esc(q.status)}</span></div><h3>${esc(q.title)}</h3><p>${canReadQuestion(q)?esc(q.body):"🔒 상세 질문은 멘토로 선택된 후 확인할 수 있어요."}</p><div class="meta"><span>${esc(q.author)} · ${esc(q.dept)}</span><span>· ${esc(q.date)}</span><span class="right">멘토 신청 ${q.applicants.length}명 &nbsp; ↗</span></div>${s.value?`<div class="reason">✧ ${esc(s.hits.join(' · '))} 업무경험과 연결되는 질문이에요</div>`:''}</button>`}function baseRender(){let navs=[['home','⌂','홈'],['questions','▤','질문 둘러보기'],['mine','◎','나의 멘토링'],['chat','♧','메시지'],['profile','♙','나의 업무경험'],['admin','⊞','관리자']];$('#nav').innerHTML=navs.map(([p,i,t])=>`<button class="${page===p?'active':''}" onclick="go('${p}')"><span>${i}</span><b>${t}</b></button>`).join('');$('#sideName').textContent=db.profile.name;if($('#role').value==='pending'){ $('#app').innerHTML=`<div class="empty"><span style="font-size:45px">◷</span><h1>가입 승인을 기다리고 있어요</h1><p>관리자가 이름과 소속 부서를 확인하면 공감을 이용할 수 있습니다.</p><button class="outline" onclick="$('#role').value='both';render()">체험 화면으로 돌아가기</button></div>`;return}let app=$('#app');if(page==='home'){let recommended=[...db.questions].filter(q=>!q.mine&&q.status==='모집 중').sort((a,b)=>score(b).value-score(a).value);app.innerHTML=`<div class="heading"><div><div class="eyebrow">A LITTLE HELP, A BIG DIFFERENCE</div><h1>${esc(db.profile.name)}님, 오늘도 함께 성장해요 <span style="color:#9baa8d">✳</span></h1><p style="margin-bottom:0">나의 경험은 누군가에게 든든한 첫걸음이 됩니다.</p></div><button class="primary" onclick="newQuestion()">＋ 질문 올리기</button></div><section class="hero"><div><span class="eyebrow">함께 배우는 공직 생활</span><h2>처음이라 어려운 업무,<br>경험 있는 동료와 함께 풀어가요.</h2><p>작은 질문 하나부터 시작하는 우리들의 멘토링.</p></div><div class="heroart"><span class="spark">✳</span><div class="bubble">···</div><div class="bubble two">↗</div></div></section><div class="stats"><div class="stat"><label>답변을 기다리는 질문</label><strong>${db.questions.filter(q=>q.status==='모집 중').length}<small>함께 풀어주세요</small></strong></div><div class="stat"><label>나에게 추천된 질문</label><strong>${recommended.filter(q=>score(q).value).length}<small>경험이 연결되는 순간</small></strong></div><div class="stat"><label>진행 중인 멘토링</label><strong>${db.rooms.filter(r=>!r.closed).length}<small>차근차근 함께</small></strong></div><div class="stat"><label>완료한 멘토링</label><strong>${db.rooms.filter(r=>r.closed).length}<small>쌓여가는 성장</small></strong></div></div><div class="columns"><section><div class="sectionhead"><h2>나의 경험이 필요한 질문 <span class="tag ai">추천</span></h2><button class="small" onclick="go('questions')">전체 보기 ↗</button></div><p class="small">등록한 업무경험을 바탕으로 연결해 드려요.</p>${recommended.slice(0,3).map(card).join('')}<div class="small" style="margin-top:13px">ⓘ 현재 추천은 업무 태그 비교를 사용하는 체험 기능입니다.</div></section><div class="rightcol"><section class="panel profile"><span class="avatar">${esc(db.profile.name[0])}</span><h3>${esc(db.profile.name)} <span class="tag">멘토·멘티</span></h3><p>${esc(db.profile.dept)}</p><div class="profiletags">${db.profile.tags.split(',').slice(0,4).map(t=>`<span class="tag">${esc(t.trim())}</span>`).join('')}</div><div class="progress"><i></i></div><div class="small">경험을 더하면 연결도 더 가까워져요.</div><button class="outline" style="width:100%;margin-top:18px" onclick="go('profile')">업무경험 관리 ↗</button></section><section class="panel"><h3>주사님 소식 <span style="float:right;color:#a1ac97">↗</span></h3><div class="notice">처음 오셨나요? 이용 가이드<small>회원가입 → 승인 → 질문 → 매칭</small></div><div class="notice">서로를 존중하는 대화를 나눠요<small>개인정보와 비공개 자료는 입력하지 마세요.</small></div><div class="notice">당신의 경험을 기다리고 있어요<small>업무경험 등록 후 추천을 확인하세요.</small></div></section></div></div>`}else if(page==='questions'||page==='mine'){app.innerHTML=`<div class="heading"><div><div class="eyebrow">${page==='mine'?'MY MENTORING':'FIND YOUR CONNECTION'}</div><h1>${page==='mine'?'나의 멘토링':'질문 둘러보기'}</h1><p>업무의 궁금함을 나누고, 함께 답을 찾아보세요.</p></div><button class="primary" onclick="newQuestion()">＋ 질문 올리기</button></div><input class="search" placeholder="제목, 내용, 업무 키워드 검색" aria-label="질문 검색" oninput="query=this.value;renderList()"><div class="filters">${categories.map(c=>`<button data-filter="${c}" onclick="filter='${c}';document.querySelectorAll('[data-filter]').forEach(b=>b.classList.toggle('selected',b.dataset.filter===filter));renderList()" class="${filter===c?'selected':''}">${c}</button>`).join('')}</div><div id="list"></div>`;renderList()}else if(page==='profile'){app.innerHTML=`<div class="eyebrow">YOUR EXPERIENCE MATTERS</div><h1>나의 업무경험</h1><p>직접 해본 업무를 기록해 주세요. 경험과 연결되는 질문을 추천해 드립니다.</p><section class="panel" style="max-width:760px"><form id="profileForm"><label>이름<input name="name" value="${esc(db.profile.name)}" required maxlength="30"></label><label>소속 부서<input name="dept" value="${esc(db.profile.dept)}" required maxlength="80"></label><label>업무 태그 · 쉼표로 구분<input name="tags" value="${esc(db.profile.tags)}" placeholder="보조금, 정산, e호조" required maxlength="250"></label><label>상세 업무경험<textarea name="experience" maxlength="3000">${esc(db.profile.experience)}</textarea></label><label style="display:flex;align-items:center"><input name="available" type="checkbox" ${db.profile.available?'checked':''}> 멘토링 신청을 받을 수 있어요</label><button class="primary">업무경험 저장</button></form></section>`;$('#profileForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);db.profile={name:f.get('name').trim(),dept:f.get('dept').trim(),tags:f.get('tags'),experience:f.get('experience'),available:f.has('available')};save();render();toast('업무경험을 저장했어요. 추천에 바로 반영됩니다.')}}else if(page==='admin'){if($('#role').value!=='admin'){app.innerHTML=`<div class="empty"><h1>관리자 전용 화면입니다</h1><p>상단 체험 역할을 ‘관리자’로 바꾸면 회원 승인 과정을 확인할 수 있어요.</p></div>`;return}app.innerHTML=`<div class="eyebrow">ADMINISTRATION</div><h1>회원 승인 관리</h1><p>소속을 확인하고 가입 신청을 승인해 주세요.</p><div class="banner">체험용 관리 화면입니다. 실제 인증·접근 통제는 서버 연결 시 적용됩니다.</div><section class="panel">${db.members.map((m,i)=>`<div class="member"><span class="avatar">${esc(m.name[0])}</span><div><strong>${esc(m.name)}</strong><p style="margin:5px 0;font-size:12px">${esc(m.dept)} · ${esc(m.role)}${m.nickname ? " · 닉네임: "+esc(m.nickname) : ""}</p></div><span class="tag">${esc(m.status)}</span>${m.status==='승인 대기'?`<div class="actions"><button class="outline" onclick="approve(${i},false)">반려</button><button class="primary" onclick="approve(${i},true)">승인</button></div>`:''}</div>`).join('')}</section><button class="outline" onclick="resetDemo()">체험 데이터 초기화</button>`}else if(page==='chat')renderChat()}
function renderList(){let list=db.questions.filter(q=>(page!=='mine'||q.mine||q.applicants.includes(db.profile.name))&&(filter==='전체'||q.category===filter)&&(q.title+(canReadQuestion(q)?q.body:'')+q.tags.join(' ')).includes(query));$('#list').innerHTML=list.length?list.map(card).join(''):'<div class="empty">조건에 맞는 질문이 없어요.</div>'}function approve(i,ok){db.members[i].status=ok?'승인 완료':'반려';save();render();toast(ok?'회원 가입을 승인했어요.':'가입 신청을 반려했어요.')}function signup(){modal(`<h2>주사님 도와주세요에서 함께 시작해요</h2><p class="small">가입 후 관리자 승인이 완료되면 서비스를 이용할 수 있어요.</p><form id="signup"><label>이름<input name="name" required maxlength="30"></label><label>소속 부서<input name="dept" required maxlength="80"></label><label>회원 유형<select name="role"><option>멘토·멘티</option><option>멘티</option><option>멘토</option></select></label><div class="small">이 시제품은 이름과 부서만 저장하며 실제 계정은 생성하지 않습니다.</div><button class="primary">가입 신청</button></form>`);$('#signup').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);db.members.push({name:f.get('name').trim(),dept:f.get('dept').trim(),role:f.get('role'),status:'승인 대기'});save();closeModal();$('#role').value='pending';render()}}
function newQuestion(){modal(`<h2>어떤 업무가 궁금하신가요?</h2><form id="newq"><label>업무 분야<select name="category">${categories.slice(1).map(c=>`<option>${c}</option>`).join('')}</select></label><label>질문 제목<input name="title" required maxlength="100" placeholder="궁금한 내용을 한 문장으로 적어 주세요"></label><label>질문 내용<textarea name="body" required maxlength="3000" placeholder="업무 상황과 궁금한 점을 구체적으로 알려 주세요."></textarea></label><label>업무 키워드<input name="tags" maxlength="200" placeholder="예: 보조금, 정산"></label><span class="small">민원인 개인정보나 비공개 행정자료는 작성하지 마세요.</span><button class="primary">질문 등록하기</button></form>`);$('#newq').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);db.questions.unshift({id:Date.now(),title:f.get('title').trim(),body:f.get('body').trim(),category:f.get('category'),tags:f.get('tags').split(',').map(t=>t.trim()).filter(Boolean),author:db.profile.name,dept:db.profile.dept,status:'모집 중',applicants:[],mine:true,date:'방금'});save();closeModal();go('mine');toast('질문을 등록했어요. 멘토의 신청을 기다려 주세요.')}}
function detail(id){let q=db.questions.find(q=>q.id===id);modal(`<span class="tag">${esc(q.category)}</span><h2 style="margin-top:18px">${esc(q.title)}</h2><div class="small">${esc(q.author)} · ${esc(q.dept)} · ${esc(q.status)}</div><p style="white-space:pre-wrap;color:#5f6f61">${canReadQuestion(q)?esc(q.body):"🔒 상세 질문은 작성자와 선택된 멘토만 확인할 수 있어요. 멘토로 신청하고 선택을 기다려 주세요."}</p><div class="filters">${q.tags.map(t=>`<span class="tag">#${esc(t)}</span>`).join('')}</div>${q.mine?`<h3>신청한 멘토 ${q.applicants.length}명</h3>${q.applicants.length?q.applicants.map(n=>`<div class="member"><span class="avatar">${esc(n[0])}</span><strong>${esc(n)}</strong>${q.status==='모집 중'?`<button class="primary" style="margin-left:auto" onclick="match(${id},'${esc(n)}')">멘토 선택</button>`:''}</div>`).join(''):'<p class="small">아직 신청한 멘토가 없어요.</p>'}${q.status==='모집 중'?`<button class="outline" onclick="sampleApplicant(${id})">샘플 멘토 신청 추가 · 체험</button>`:''}`:q.status==='모집 중'?`<button class="primary" onclick="applyMentor(${id})" ${q.applicants.includes(db.profile.name)?'disabled':''}>${q.applicants.includes(db.profile.name)?'멘토 신청 완료':'멘토로 신청하기'}</button>`:''}${q.status!=='모집 중'&&canReadQuestion(q)?'<div class="actions"><button class="outline" onclick="closeModal();go(\'chat\')">채팅방 보기 ↗</button></div>':''}`)}function sampleApplicant(id){let q=db.questions.find(q=>q.id===id);if(!q.applicants.includes('든든선배'))q.applicants.push('든든선배');else if(!q.applicants.includes('회계요정'))q.applicants.push('회계요정');save();detail(id)}function applyMentor(id){if(!db.profile.available){toast('업무경험에서 멘토 활동 상태를 켜주세요.');return}let q=db.questions.find(q=>q.id===id);if(!q.applicants.includes(db.profile.name))q.applicants.push(db.profile.name);save();detail(id);toast('멘토 신청을 완료했어요. 멘티의 선택을 기다려 주세요.')}function match(id,n){let q=db.questions.find(q=>q.id===id);if(q.status!=='모집 중')return;q.status='진행 중';q.mentor=n;db.rooms.push({id,title:q.title,mentor:n,messages:[{who:'system',text:'매칭이 완료되었어요. 서로 인사를 나누고 멘토링을 시작해 보세요.'}],closed:false});roomId=id;save();closeModal();go('chat');toast('멘토와 연결되었어요!')}function renderChat(){let r=db.rooms.find(r=>r.id===roomId)||db.rooms[0];roomId=r?.id;$('#app').innerHTML=`<div class="eyebrow">A CONVERSATION THAT HELPS</div><h1>메시지</h1><p>매칭된 동료와 편하게 이야기 나눠보세요.</p><div class="banner">이 기기에 대화를 저장하는 채팅 체험입니다. 다른 사용자와의 실시간 송수신은 서버 연결 후 작동합니다.</div><div class="chatlayout"><div class="chatlist"><h3>나의 대화 ${db.rooms.length}</h3>${db.rooms.map(x=>`<button class="card" onclick="roomId=${x.id};renderChat()" style="padding:14px;${r.id===x.id?'background:#edf3e9':''}"><strong>${esc(x.mentor)}</strong><p style="margin-top:8px">${esc(x.title)}</p><span class="tag" style="margin-top:8px">${x.closed?'완료':'진행 중'}</span></button>`).join('')}</div><div class="chatroom">${r?`<div class="sectionhead"><div><strong>${esc(r.mentor)} 멘토</strong><p class="small" style="margin-bottom:0">${esc(r.title)}</p></div>${!r.closed?`<button class="outline" onclick="finish(${r.id})">멘토링 완료</button>`:'<span class="tag">완료된 멘토링</span>'}</div><div class="messages" id="messages">${r.messages.map(m=>`<div class="message ${m.who==='me'?'mine':''}">${esc(m.text)}<small>${m.who==='me'?'나':m.who==='system'?'서비스 안내':esc(r.mentor)}</small></div>`).join('')}</div><form class="chatcompose" id="compose"><input aria-label="메시지" name="text" placeholder="${r.closed?'완료된 대화입니다':'메시지를 입력해 주세요'}" required maxlength="3000" ${r.closed?'disabled':''}><button class="primary" ${r.closed?'disabled':''}>보내기 ↑</button></form>${!r.closed?'<button class="small" style="margin-top:12px;text-align:left" onclick="sampleReply()">상대방 샘플 메시지 추가 · 체험</button>':''}`:'<div class="empty">매칭 후 채팅방이 생성됩니다.</div>'}</div></div>`;if(r){$('#messages').scrollTop=$('#messages').scrollHeight;$('#compose').onsubmit=e=>{e.preventDefault();let t=new FormData(e.target).get('text').trim();if(!t||r.closed)return;r.messages.push({who:'me',text:t});save();renderChat();$('#compose input').focus()}}}function sampleReply(){let r=db.rooms.find(r=>r.id===roomId);r.messages.push({who:'mentor',text:'말씀해 주신 내용을 확인했어요. 어떤 절차에서 어려움이 있으신지 함께 살펴볼까요?'});save();renderChat()}function finish(id){modal(`<h2>멘토링을 마무리할까요?</h2><form id="finish"><label>도움이 되었나요?<select name="rating"><option value="5">매우 도움이 되었어요</option><option value="4">도움이 되었어요</option><option value="3">보통이에요</option><option value="2">조금 아쉬워요</option><option value="1">도움이 필요해요</option></select></label><label>남기고 싶은 의견<textarea name="feedback" maxlength="1000"></textarea></label><button class="primary">평가하고 완료하기</button></form>`);$('#finish').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),r=db.rooms.find(r=>r.id===id);r.closed=true;r.rating=f.get('rating');r.feedback=f.get('feedback');let q=db.questions.find(q=>q.id===id);if(q)q.status='완료';save();closeModal();renderChat();toast('멘토링을 완료했어요. 함께해 주셔서 감사합니다.')}}function resetDemo(){modal('<h2>체험 데이터를 초기화할까요?</h2><p>이 기기에 작성한 질문, 프로필, 대화가 처음 상태로 돌아갑니다.</p><div class="actions"><button class="outline" onclick="closeModal()">취소</button><button class="primary" onclick="db=structuredClone(defaults);roomId=100;save();closeModal();render();toast(\'초기화했어요.\')">초기화</button></div>')}

const tagGroups={'예산·회계':['보조금','정산','예산편성','e호조','지출결의'],'계약·지출':['수의계약','입찰','계약','물품관리'],'인사·복무':['인사','급여','복무','교육훈련'],'사업·기획':['청년','프로그램','행사','홍보','기획'],'민원·복지':['민원','복지','사례관리','주민자치']};

function initGame(){if(!db.xpRule20){db.profile.xp=Math.max(0,(Number(db.profile.xp)||0)-db.rooms.filter(r=>r.xpGranted).length*80);db.xpRule20=true;}db.profile.xp=Number(db.profile.xp)||0;db.profile.avatar=db.profile.avatar||'sprout';if((avatarTypes.find(a=>a.id===db.profile.avatar)?.xp||0)>(db.profile.xp||0))db.profile.avatar='sprout';db.profile.tint=db.profile.tint||'#83ac74';db.profile.bg=db.profile.bg||'#e8efdf';db.profile.accessory=db.profile.accessory||'none';db.profile.realName=db.profile.realName||'김서연';if(!db.profile.nicknameReady){let old=db.profile.name;db.profile.name='새싹주사';db.profile.nicknameReady=true;db.questions.forEach(q=>{if(q.mine)q.author=db.profile.name;q.applicants=q.applicants.map(n=>n===old?db.profile.name:n)});}if(!db.rooms.some(r=>r.id===200)){db.rooms.push({id:200,title:'보조금 정산 순서를 알려주세요 · 멘토 체험',mentor:db.profile.name,peer:'첫걸음주사',myRole:'mentor',messages:[{who:'mentor',text:'안녕하세요! 보조금 정산을 처음 맡았어요. 확인 순서를 알려주실 수 있나요?'}],closed:false})}save()}

function archiveView(){let approved=db.caseRequests.filter(consentGranted).length;$('#app').innerHTML=`<div class="eyebrow">LEARN FROM SHARED EXPERIENCE</div><h1>완료된 멘토링 사례</h1><p>질문 제목과 분야로 사례를 찾아보세요. 열람 신청 후 멘토·멘티 모두 동의하면 내용을 확인할 수 있어요.</p><div class="admin-tabs"><button class="${archiveMode==='cases'?'active':''}" onclick="archiveMode='cases';archiveView()">사례 검색</button><button class="${archiveMode==='requests'?'active':''}" onclick="archiveMode='requests';archiveView()">열람 신청·동의 ${db.caseRequests.length?`(${db.caseRequests.length})`:''}</button></div>${archiveMode==='cases'?`<div class="archive-toolbar"><input aria-label="완료 사례 검색" placeholder="완료된 질문 제목, 업무 분야 또는 태그 검색" value="${esc(archiveQuery)}" oninput="archiveQuery=this.value;archiveRows()"><select aria-label="완료 사례 분야" onchange="archiveCategory=this.value;archiveRows()">${categories.map(c=>`<option ${c===archiveCategory?'selected':''}>${c}</option>`).join('')}</select></div><div id="archiveRows"></div>`:`<div class="banner">체험판에서는 각 신청의 ‘동의 절차 체험’에서 멘토·멘티 역할을 대신 눌러볼 수 있어요. 실제 서비스에서는 각 당사자의 계정에서만 승인하게 됩니다.</div>${db.caseRequests.length?db.caseRequests.map(r=>{let q=db.questions.find(q=>q.id===r.caseId);return `<section class="card"><div class="cardtop"><span class="tag">${esc(requestState(r))}</span><span class="small">신청자: ${esc(r.requesterName)}</span></div><h3>${esc(q?.title||'완료된 사례')}</h3><div class="consent-status">멘토 ${esc(q?.mentor||'담당 멘토')} · ${esc(r.mentor)} &nbsp; / &nbsp; 멘티 ${esc(q?.author||'작성자')} · ${esc(r.mentee)}</div><div class="archive-controls"><button class="outline" onclick="consentDemo('${r.id}')">동의 절차 체험</button><button class="outline" onclick="detail(${r.caseId})">사례 보기</button></div></section>`}).join(''):'<div class="empty">아직 열람 신청이 없어요. 사례 검색에서 원하는 사례를 신청해 주세요.</div>'}`}`;if(archiveMode==='cases')archiveRows()}
function archiveRows(){let qs=db.questions.filter(q=>q.status==='완료'&&(archiveCategory==='전체'||q.category===archiveCategory)&&(q.title+' '+q.category+' '+q.tags.join(' ')).includes(archiveQuery));$('#archiveRows').innerHTML=qs.length?qs.map(q=>`<button class="card" onclick="detail(${q.id})"><div class="cardtop"><span class="tag">${esc(q.category)} · 멘토링 완료</span><span class="status">${esc(requestState(myCaseRequest(q.id)))}</span></div><h3>${esc(q.title)}</h3><p>멘티 ${esc(q.author)} · 멘토 ${esc(q.mentor||'담당 멘토')}</p><div class="meta">${q.tags.map(t=>'#'+esc(t)).join(' · ')}<span class="right">${canReadQuestion(q)?'내용 확인 ↗':'열람 신청 ↗'}</span></div></button>`).join(''):'<div class="empty">검색 조건에 맞는 완료 사례가 없습니다.</div>'}
const questionDetailBeforeArchive=detail;detail=function(id){let q=db.questions.find(q=>q.id===id);if(q?.status!=='완료'){questionDetailBeforeArchive(id);return}let r=myCaseRequest(id),visible=canReadQuestion(q);modal(`<span class="tag">${esc(q.category)} · 완료된 멘토링</span><h2 style="margin-top:16px">${esc(q.title)}</h2><div class="small">멘티 ${esc(q.author)} · 멘토 ${esc(q.mentor||'담당 멘토')}</div>${visible?`<div class="case-lock">✓ ${privateQuestionRule(q)?'참여한 멘토링 사례입니다.':'멘토와 멘티가 모두 동의하여 열람할 수 있습니다.'}</div><h3>상세 질문</h3><p style="white-space:pre-wrap">${esc(q.body)}</p><h3>멘토링 내용</h3><div class="case-transcript">${caseTranscript(q).map(m=>`<p><strong>${esc(m.speaker)}</strong><br>${esc(m.text)}</p>`).join('')}</div>`:`<div class="case-lock">🔒 상세 질문과 대화 내용은 비공개입니다.<br>열람 신청 후 해당 멘토와 멘티가 모두 승인하면 이 신청자에게만 내용이 열립니다. 한쪽이라도 반려하면 열리지 않아요.</div>${r?`<strong>${esc(requestState(r))}</strong><p class="small">멘토: ${esc(r.mentor)} / 멘티: ${esc(r.mentee)}</p>`:''}${!r?`<button class="primary" onclick="requestCase(${id})">멘토링 내용 열람 신청</button>`:''}`}${r?`<div class="actions"><button class="outline" onclick="consentDemo('${r.id}')">동의 절차 체험</button></div>`:''}`)};
function caseTranscript(q){if(q.sharedTranscript)return q.sharedTranscript;let room=db.rooms.find(r=>r.id===q.id);return room?.messages.map(m=>({speaker:m.who==='system'?'안내':m.who==='me'?(room.myRole==='mentor'?'멘토':'멘티'):(room.myRole==='mentor'?'멘티':'멘토'),text:m.text}))||[{speaker:'안내',text:'이 사례에는 저장된 대화 내용이 없습니다.'}]}
function requestCase(id){let q=db.questions.find(q=>q.id===id);if(!q||q.status!=='완료'||myCaseRequest(id))return;modal(`<h2>멘토링 내용 열람 신청</h2><p class="small">${esc(q.title)}</p><form id="caseRequestForm"><label>열람 신청 이유<textarea name="reason" required maxlength="500" placeholder="어떤 업무에 참고하려는지 알려주세요."></textarea></label><p class="small">신청 이유와 닉네임을 멘토·멘티에게 전달하는 체험입니다. 두 사람 모두 승인해야 내용이 열립니다.</p><button class="primary">열람 신청하기</button></form>`);$('#caseRequestForm').onsubmit=e=>{e.preventDefault();let reason=new FormData(e.target).get('reason').trim();if(!reason){toast('신청 이유를 입력해 주세요.');return}db.caseRequests.push({id:String(Date.now()),caseId:id,requesterId:db.profile.memberKey,requesterName:db.profile.name,reason,mentor:'대기',mentee:'대기',createdAt:new Date().toISOString()});save();closeModal();detail(id);toast('열람 신청을 등록했어요. 멘토와 멘티의 동의를 기다려 주세요.')};}
function consentDemo(requestId){let r=db.caseRequests.find(r=>r.id===requestId);if(!r)return;let q=db.questions.find(q=>q.id===r.caseId);modal(`<h2>열람 신청 동의 · 체험</h2><div class="banner">승인 흐름 확인용입니다. 실제 당사자 인증이나 알림 전송은 하지 않습니다.</div><h3>${esc(q.title)}</h3><p class="small">신청자 ${esc(r.requesterName)}</p><div class="request-note">${esc(r.reason)}</div><div class="consent-grid">${[['mentor','멘토',q.mentor||'담당 멘토'],['mentee','멘티',q.author]].map(([key,role,name])=>`<div class="consent-person"><strong>${role} · ${esc(name)}</strong><span class="tag">${esc(r[key])}</span><div class="actions"><button class="primary" onclick="decideConsent('${r.id}','${key}','승인')">승인 체험</button><button class="outline" onclick="decideConsent('${r.id}','${key}','반려')">반려 체험</button>${r[key]!=='대기'?`<button class="small" onclick="decideConsent('${r.id}','${key}','대기')">동의 철회</button>`:''}</div></div>`).join('')}</div><div class="case-lock">${consentGranted(r)?'✓ 양측 승인 완료! 신청자가 이 사례 내용을 확인할 수 있어요.':'🔒 '+esc(requestState(r))+' · 두 사람 모두 승인해야 열립니다.'}</div><button class="outline" onclick="detail(${q.id})">신청자 화면으로 확인 →</button>`)}
function decideConsent(id,role,decision){if(!['mentor','mentee'].includes(role)||!['승인','반려','대기'].includes(decision))return;let r=db.caseRequests.find(r=>r.id===id);if(!r)return;r[role]=decision;r.updatedAt=new Date().toISOString();save();consentDemo(id)}
guideSteps[1].target='.primary-guide-target';initGame();initArchive();$('#role').onchange=render;render();
</script></body></html>
