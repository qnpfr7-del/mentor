ick="closeModal()">×</button>${html}</section></div>`;$('#overlay input, #overlay textarea, #overlay button')?.focus()}function closeModal(){$('#overlay').innerHTML=''}document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});function go(p){page=p;filter='전체';query='';render()}function score(q){let terms=db.profile.tags.split(/[,\s]+/).filter(Boolean);let hits=terms.filter(t=>(q.title+q.body+q.category+q.tags.join(' ')).includes(t));return {value:hits.length,hits}}function card(q){let s=score(q);return `<button class="card" onclick="detail(${q.id})"><div class="cardtop"><div><span class="tag">${esc(q.category)}</span> ${s.value?'<span class="tag ai">✧ 경험 기반 추천</span>':''}</div><span class="${q.status==='모집 중'?'status':'tag'}">${esc(q.status)}</span></div><h3>${esc(q.title)}</h3><p>${canReadQuestion(q)?esc(q.body):"🔒 상세 질문은 멘토로 선택된 후 확인할 수 있어요."}</p><div class="meta"><span>${esc(q.author)} · ${esc(q.dept)}</span><span>· ${esc(q.date)}</span><span class="right">멘토 신청 ${q.applicants.length}명 &nbsp; ↗</span></div>${s.value?`<div class="reason">✧ ${esc(s.hits.join(' · '))} 업무경험과 연결되는 질문이에요</div>`:''}</button>`}function baseRender(){let navs=[['home','⌂','홈'],['questions','▤','질문 둘러보기'],['mine','◎','나의 멘토링'],['chat','♧','메시지'],['profile','♙','나의 업무경험'],['admin','⊞','관리자']];$('#nav').innerHTML=navs.map(([p,i,t])=>`<button class="${page===p?'active':''}" onclick="go('${p}')"><span>${i}</span><b>${t}</b></button>`).join('');$('#sideName').textContent=db.profile.name;if($('#role').value==='pending'){ $('#app').innerHTML=`<div class="empty"><span style="font-size:45px">◷</span><h1>가입 승인을 기다리고 있어요</h1><p>관리자가 이름과 소속 부서를 확인하면 공감을 이용할 수 있습니다.</p><button class="outline" onclick="$('#role').value='both';render()">체험 화면으로 돌아가기</button></div>`;return}let app=$('#app');if(page==='home'){let recommended=[...db.questions].filter(q=>!q.mine&&q.status==='모집 중').sort((a,b)=>score(b).value-score(a).value);app.innerHTML=`<div class="heading"><div><div class="eyebrow">A LITTLE HELP, A BIG DIFFERENCE</div><h1>${esc(db.profile.name)}님, 오늘도 함께 성장해요 <span style="color:#9baa8d">✳</span></h1><p style="margin-bottom:0">나의 경험은 누군가에게 든든한 첫걸음이 됩니다.</p></div><button class="primary" onclick="newQuestion()">＋ 질문 올리기</button></div><section class="hero"><div><span class="eyebrow">함께 배우는 공직 생활</span><h2>처음이라 어려운 업무,<br>경험 있는 동료와 함께 풀어가요.</h2><p>작은 질문 하나부터 시작하는 우리들의 멘토링.</p></div><div class="heroart"><span class="spark">✳</span><div class="bubble">···</div><div class="bubble two">↗</div></div></section><div class="stats"><div class="stat"><label>답변을 기다리는 질문</label><strong>${db.questions.filter(q=>q.status==='모집 중').length}<small>함께 풀어주세요</small></strong></div><div class="stat"><label>나에게 추천된 질문</label><strong>${recommended.filter(q=>score(q).value).length}<small>경험이 연결되는 순간</small></strong></div><div class="stat"><label>진행 중인 멘토링</label><strong>${db.rooms.filter(r=>!r.closed).length}<small>차근차근 함께</small></strong></div><div class="stat"><label>완료한 멘토링</label><strong>${db.rooms.filter(r=>r.closed).length}<small>쌓여가는 성장</small></strong></div></div><div class="columns"><section><div class="sectionhead"><h2>나의 경험이 필요한 질문 <span class="tag ai">추천</span></h2><button class="small" onclick="go('questions')">전체 보기 ↗</button></div><p class="small">등록한 업무경험을 바탕으로 연결해 드려요.</p>${recommended.slice(0,3).map(card).join('')}<div class="small" style="margin-top:13px">ⓘ 현재 추천은 업무 태그 비교를 사용하는 체험 기능입니다.</div></section><div class="rightcol"><section class="panel profile"><span class="avatar">${esc(db.profile.name[0])}</span><h3>${esc(db.profile.name)} <span class="tag">멘토·멘티</span></h3><p>${esc(db.profile.dept)}</p><div class="profiletags">${db.profile.tags.split(',').slice(0,4).map(t=>`<span class="tag">${esc(t.trim())}</span>`).join('')}</div><div class="progress"><i></i></div><div class="small">경험을 더하면 연결도 더 가까워져요.</div><button class="outline" style="width:100%;margin-top:18px" onclick="go('profile')">업무경험 관리 ↗</button></section><section class="panel"><h3>주사님 소식 <span style="float:right;color:#a1ac97">↗</span></h3><div class="notice">처음 오셨나요? 이용 가이드<small>회원가입 → 승인 → 질문 → 매칭</small></div><div class="notice">서로를 존중하는 대화를 나눠요<small>개인정보와 비공개 자료는 입력하지 마세요.</small></div><div class="notice">당신의 경험을 기다리고 있어요<small>업무경험 등록 후 추천을 확인하세요.</small></div></section></div></div>`}else if(page==='questions'||page==='mine'){app.innerHTML=`<div class="heading"><div><div class="eyebrow">${page==='mine'?'MY MENTORING':'FIND YOUR CONNECTION'}</div><h1>${page==='mine'?'나의 멘토링':'질문 둘러보기'}</h1><p>업무의 궁금함을 나누고, 함께 답을 찾아보세요.</p></div><button class="primary" onclick="newQuestion()">＋ 질문 올리기</button></div><input class="search" placeholder="제목, 내용, 업무 키워드 검색" aria-label="질문 검색" oninput="query=this.value;renderList()"><div class="filters">${categories.map(c=>`<button data-filter="${c}" onclick="filter='${c}';document.querySelectorAll('[data-filter]').forEach(b=>b.classList.toggle('selected',b.dataset.filter===filter));renderList()" class="${filter===c?'selected':''}">${c}</button>`).join('')}</div><div id="list"></div>`;renderList()}else if(page==='profile'){app.innerHTML=`<div class="eyebrow">YOUR EXPERIENCE MATTERS</div><h1>나의 업무경험</h1><p>직접 해본 업무를 기록해 주세요. 경험과 연결되는 질문을 추천해 드립니다.</p><section class="panel" style="max-width:760px"><form id="profileForm"><label>이름<input name="name" value="${esc(db.profile.name)}" required maxlength="30"></label><label>소속 부서<input name="dept" value="${esc(db.profile.dept)}" required maxlength="80"></label><label>업무 태그 · 쉼표로 구분<input name="tags" value="${esc(db.profile.tags)}" placeholder="보조금, 정산, e호조" required maxlength="250"></label><label>상세 업무경험<textarea name="experience" maxlength="3000">${esc(db.profile.experience)}</textarea></label><label style="display:flex;align-items:center"><input name="available" type="checkbox" ${db.profile.available?'checked':''}> 멘토링 신청을 받을 수 있어요</label><button class="primary">업무경험 저장</button></form></section>`;$('#profileForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);db.profile={name:f.get('name').trim(),dept:f.get('dept').trim(),tags:f.get('tags'),experience:f.get('experience'),available:f.has('available')};save();render();toast('업무경험을 저장했어요. 추천에 바로 반영됩니다.')}}else if(page==='admin'){if($('#role').value!=='admin'){app.innerHTML=`<div class="empty"><h1>관리자 전용 화면입니다</h1><p>상단 체험 역할을 ‘관리자’로 바꾸면 회원 승인 과정을 확인할 수 있어요.</p></div>`;return}app.innerHTML=`<div class="eyebrow">ADMINISTRATION</div><h1>회원 승인 관리</h1><p>소속을 확인하고 가입 신청을 승인해 주세요.</p><div class="banner">체험용 관리 화면입니다. 실제 인증·접근 통제는 서버 연결 시 적용됩니다.</div><section class="panel">${db.members.map((m,i)=>`<div class="member"><span class="avatar">${esc(m.name[0])}</span><div><strong>${esc(m.name)}</strong><p style="margin:5px 0;font-size:12px">${esc(m.dept)} · ${esc(m.role)}${m.nickname ? " · 닉네임: "+esc(m.nickname) : ""}</p></div><span class="tag">${esc(m.status)}</span>${m.status==='승인 대기'?`<div class="actions"><button class="outline" onclick="approve(${i},false)">반려</button><button class="primary" onclick="approve(${i},true)">승인</button></div>`:''}</div>`).join('')}</section><button class="outline" onclick="resetDemo()">체험 데이터 초기화</button>`}else if(page==='chat')renderChat()}
function renderList(){let list=db.questions.filter(q=>(page!=='mine'||q.mine||q.applicants.includes(db.profile.name))&&(filter==='전체'||q.category===filter)&&(q.title+(canReadQuestion(q)?q.body:'')+q.tags.join(' ')).includes(query));$('#list').innerHTML=list.length?list.map(card).join(''):'<div class="empty">조건에 맞는 질문이 없어요.</div>'}function approve(i,ok){db.members[i].status=ok?'승인 완료':'반려';save();render();toast(ok?'회원 가입을 승인했어요.':'가입 신청을 반려했어요.')}function signup(){modal(`<h2>주사님 도와주세요에서 함께 시작해요</h2><p class="small">가입 후 관리자 승인이 완료되면 서비스를 이용할 수 있어요.</p><form id="signup"><label>이름<input name="name" required maxlength="30"></label><label>소속 부서<input name="dept" required maxlength="80"></label><label>회원 유형<select name="role"><option>멘토·멘티</option><option>멘티</option><option>멘토</option></select></label><div class="small">이 시제품은 이름과 부서만 저장하며 실제 계정은 생성하지 않습니다.</div><button class="primary">가입 신청</button></form>`);$('#signup').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);db.members.push({name:f.get('name').trim(),dept:f.get('dept').trim(),role:f.get('role'),status:'승인 대기'});save();closeModal();$('#role').value='pending';render()}}
function newQuestion(){modal(`<h2>어떤 업무가 궁금하신가요?</h2><form id="newq"><label>업무 분야<select name="category">${categories.slice(1).map(c=>`<option>${c}</option>`).join('')}</select></label><label>질문 제목<input name="title" required maxlength="100" placeholder="궁금한 내용을 한 문장으로 적어 주세요"></label><label>질문 내용<textarea name="body" required maxlength="3000" placeholder="업무 상황과 궁금한 점을 구체적으로 알려 주세요."></textarea></label><label>업무 키워드<input name="tags" maxlength="200" placeholder="예: 보조금, 정산"></label><span class="small">민원인 개인정보나 비공개 행정자료는 작성하지 마세요.</span><button class="primary">질문 등록하기</button></form>`);$('#newq').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);db.questions.unshift({id:Date.now(),title:f.get('title').trim(),body:f.get('body').trim(),category:f.get('category'),tags:f.get('tags').split(',').map(t=>t.trim()).filter(Boolean),author:db.profile.name,dept:db.profile.dept,status:'모집 중',applicants:[],mine:true,date:'방금'});save();closeModal();go('mine');toast('질문을 등록했어요. 멘토의 신청을 기다려 주세요.')}}
function detail(id){let q=db.questions.find(q=>q.id===id);modal(`<span class="tag">${esc(q.category)}</span><h2 style="margin-top:18px">${esc(q.title)}</h2><div class="small">${esc(q.author)} · ${esc(q.dept)} · ${esc(q.status)}</div><p style="white-space:pre-wrap;color:#5f6f61">${canReadQuestion(q)?esc(q.body):"🔒 상세 질문은 작성자와 선택된 멘토만 확인할 수 있어요. 멘토로 신청하고 선택을 기다려 주세요."}</p><div class="filters">${q.tags.map(t=>`<span class="tag">#${esc(t)}</span>`).join('')}</div>${q.mine?`<h3>신청한 멘토 ${q.applicants.length}명</h3>${q.applicants.length?q.applicants.map(n=>`<div class="member"><span class="avatar">${esc(n[0])}</span><strong>${esc(n)}</strong>${q.status==='모집 중'?`<button class="primary" style="margin-left:auto" onclick="match(${id},'${esc(n)}')">멘토 선택</button>`:''}</div>`).join(''):'<p class="small">아직 신청한 멘토가 없어요.</p>'}${q.status==='모집 중'?`<button class="outline" onclick="sampleApplicant(${id})">샘플 멘토 신청 추가 · 체험</button>`:''}`:q.status==='모집 중'?`<button class="primary" onclick="applyMentor(${id})" ${q.applicants.includes(db.profile.name)?'disabled':''}>${q.applicants.includes(db.profile.name)?'멘토 신청 완료':'멘토로 신청하기'}</button>`:''}${q.status!=='모집 중'&&canReadQuestion(q)?'<div class="actions"><button class="outline" onclick="closeModal();go(\'chat\')">채팅방 보기 ↗</button></div>':''}`)}function sampleApplicant(id){let q=db.questions.find(q=>q.id===id);if(!q.applicants.includes('든든선배'))q.applicants.push('든든선배');else if(!q.applicants.includes('회계요정'))q.applicants.push('회계요정');save();detail(id)}function applyMentor(id){if(!db.profile.available){toast('업무경험에서 멘토 활동 상태를 켜주세요.');return}let q=db.questions.find(q=>q.id===id);if(!q.applicants.includes(db.profile.name))q.applicants.push(db.profile.name);save();detail(id);toast('멘토 신청을 완료했어요. 멘티의 선택을 기다려 주세요.')}function match(id,n){let q=db.questions.find(q=>q.id===id);if(q.status!=='모집 중')return;q.status='진행 중';q.mentor=n;db.rooms.push({id,title:q.title,mentor:n,messages:[{who:'system',text:'매칭이 완료되었어요. 서로 인사를 나누고 멘토링을 시작해 보세요.'}],closed:false});roomId=id;save();closeModal();go('chat');toast('멘토와 연결되었어요!')}function renderChat(){let r=db.rooms.find(r=>r.id===roomId)||db.rooms[0];roomId=r?.id;$('#app').innerHTML=`<div class="eyebrow">A CONVERSATION THAT HELPS</div><h1>메시지</h1><p>매칭된 동료와 편하게 이야기 나눠보세요.</p><div class="banner">이 기기에 대화를 저장하는 채팅 체험입니다. 다른 사용자와의 실시간 송수신은 서버 연결 후 작동합니다.</div><div class="chatlayout"><div class="chatlist"><h3>나의 대화 ${db.rooms.length}</h3>${db.rooms.map(x=>`<button class="card" onclick="roomId=${x.id};renderChat()" style="padding:14px;${r.id===x.id?'background:#edf3e9':''}"><strong>${esc(x.mentor)}</strong><p style="margin-top:8px">${esc(x.title)}</p><span class="tag" style="margin-top:8px">${x.closed?'완료':'진행 중'}</span></button>`).join('')}</div><div class="chatroom">${r?`<div class="sectionhead"><div><strong>${esc(r.mentor)} 멘토</strong><p class="small" style="margin-bottom:0">${esc(r.title)}</p></div>${!r.closed?`<button class="outline" onclick="finish(${r.id})">멘토링 완료</button>`:'<span class="tag">완료된 멘토링</span>'}</div><div class="messages" id="messages">${r.messages.map(m=>`<div class="message ${m.who==='me'?'mine':''}">${esc(m.text)}<small>${m.who==='me'?'나':m.who==='system'?'서비스 안내':esc(r.mentor)}</small></div>`).join('')}</div><form class="chatcompose" id="compose"><input aria-label="메시지" name="text" placeholder="${r.closed?'완료된 대화입니다':'메시지를 입력해 주세요'}" required maxlength="3000" ${r.closed?'disabled':''}><button class="primary" ${r.closed?'disabled':''}>보내기 ↑</button></form>${!r.closed?'<button class="small" style="margin-top:12px;text-align:left" onclick="sampleReply()">상대방 샘플 메시지 추가 · 체험</button>':''}`:'<div class="empty">매칭 후 채팅방이 생성됩니다.</div>'}</div></div>`;if(r){$('#messages').scrollTop=$('#messages').scrollHeight;$('#compose').onsubmit=e=>{e.preventDefault();let t=new FormData(e.target).get('text').trim();if(!t||r.closed)return;r.messages.push({who:'me',text:t});save();renderChat();$('#compose input').focus()}}}function sampleReply(){let r=db.rooms.find(r=>r.id===roomId);r.messages.push({who:'mentor',text:'말씀해 주신 내용을 확인했어요. 어떤 절차에서 어려움이 있으신지 함께 살펴볼까요?'});save();renderChat()}function finish(id){modal(`<h2>멘토링을 마무리할까요?</h2><form id="finish"><label>도움이 되었나요?<select name="rating"><option value="5">매우 도움이 되었어요</option><option value="4">도움이 되었어요</option><option value="3">보통이에요</option><option value="2">조금 아쉬워요</option><option value="1">도움이 필요해요</option></select></label><label>남기고 싶은 의견<textarea name="feedback" maxlength="1000"></textarea></label><button class="primary">평가하고 완료하기</button></form>`);$('#finish').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),r=db.rooms.find(r=>r.id===id);r.closed=true;r.rating=f.get('rating');r.feedback=f.get('feedback');let q=db.questions.find(q=>q.id===id);if(q)q.status='완료';save();closeModal();renderChat();toast('멘토링을 완료했어요. 함께해 주셔서 감사합니다.')}}function resetDemo(){modal('<h2>체험 데이터를 초기화할까요?</h2><p>이 기기에 작성한 질문, 프로필, 대화가 처음 상태로 돌아갑니다.</p><div class="actions"><button class="outline" onclick="closeModal()">취소</button><button class="primary" onclick="db=structuredClone(defaults);roomId=100;save();closeModal();render();toast(\'초기화했어요.\')">초기화</button></div>')}

const tagGroups={'예산·회계':['보조금','정산','예산편성','e호조','지출결의'],'계약·지출':['수의계약','입찰','계약','물품관리'],'인사·복무':['인사','급여','복무','교육훈련'],'사업·기획':['청년','프로그램','행사','홍보','기획'],'민원·복지':['민원','복지','사례관리','주민자치']};
const avatarTypes=[{id:'sprout',name:'새싹 주사님',xp:0,color:'#83ac74'},{id:'cat',name:'고양이 주사님',xp:100,color:'#d2a060'},{id:'rabbit',name:'토끼 주사님',xp:300,color:'#dca9ae'},{id:'fox',name:'여우 주사님',xp:600,color:'#cf8050'},{id:'wizard',name:'해결사 마법사',xp:1000,color:'#9983be'},{id:'crown',name:'공직 마스터',xp:1500,color:'#cfb455'}];
let selectedTags=[];
function initGame(){if(!db.xpRule20){db.profile.xp=Math.max(0,(Number(db.profile.xp)||0)-db.rooms.filter(r=>r.xpGranted).length*80);db.xpRule20=true;}db.profile.xp=Number(db.profile.xp)||0;db.profile.avatar=db.profile.avatar||'sprout';if((avatarTypes.find(a=>a.id===db.profile.avatar)?.xp||0)>(db.profile.xp||0))db.profile.avatar='sprout';db.profile.tint=db.profile.tint||'#83ac74';db.profile.bg=db.profile.bg||'#e8efdf';db.profile.accessory=db.profile.accessory||'none';db.profile.realName=db.profile.realName||'김서연';if(!db.profile.nicknameReady){let old=db.profile.name;db.profile.name='새싹주사';db.profile.nicknameReady=true;db.questions.forEach(q=>{if(q.mine)q.author=db.profile.name;q.applicants=q.applicants.map(n=>n===old?db.profile.name:n)});}if(!db.rooms.some(r=>r.id===200)){db.rooms.push({id:200,title:'보조금 정산 순서를 알려주세요 · 멘토 체험',mentor:db.profile.name,peer:'첫걸음주사',myRole:'mentor',messages:[{who:'mentor',text:'안녕하세요! 보조금 정산을 처음 맡았어요. 확인 순서를 알려주실 수 있나요?'}],closed:false})}save()}
function canReadQuestion(q){return !!q&&(q.mine===true||(q.status!=='모집 중'&&q.mentor===db.profile.name))}function xp(){return db.profile.xp||0}function level(){return Math.floor(xp()/100)+1}
function pixel(type=db.profile.avatar,tint=db.profile.tint,bg=db.profile.bg,accessory=db.profile.accessory){let a=avatarTypes.find(a=>a.id===type)||avatarTypes[0];let ears=type==='rabbit'?'<path d="M8 9V2h3v7m5 0V2h-3v7" fill="'+tint+'"/>':type==='cat'||type==='fox'?'<path d="M5 10V4h3v2h2v4m4 0V6h2V4h3v6" fill="'+tint+'"/>':'';let top=type==='sprout'?'<path d="M11 8V5H8V3h4v2h4V2h3v4h-5v2" fill="#508457"/>':type==='wizard'?'<path d="M5 9h14v-2h-3V5h-2V1h-3v4H8v2H5z" fill="#7b64a4"/>':type==='crown'?'<path d="M6 9V3h2v2h3V2h2v3h3V3h2v6z" fill="#e4b947"/>':'';let acc=accessory==='glasses'?'<path d="M7 11h4v3H7zm6 0h4v3h-4zm-2 1h2" fill="none" stroke="#344d40" stroke-width="1"/>':accessory==='blush'?'<path d="M6 14h3v1H6zm9 0h3v1h-3z" fill="#ed8d98"/>':accessory==='tie'?'<path d="M11 19h2v3h-2z" fill="#edbd62"/>':'';return `<span class="pixel" role="img" aria-label="${a.name}"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" shape-rendering="crispEdges"><rect width="24" height="24" rx="3" fill="${bg}"/>${ears}<path d="M7 8h10v2h2v7h-2v2H7v-2H5v-7h2z" fill="${type==='fox'?'#ecaa6f':'#f1cfaa'}"/><path d="M8 18h8v2h3v4H5v-4h3z" fill="${tint}"/><path d="M8 11h2v2H8zm6 0h2v2h-2z" fill="#344238"/><path d="M10 15h4v1h-4z" fill="#ad7966"/>${top}${acc}</svg></span>`}
function xpPanel(){let next=avatarTypes.find(a=>a.xp>xp());return `<section class="xp-card">${pixel()}<div class="xp-info"><div class="eyebrow" style="color:#bddd9f">MY GROWTH JOURNEY</div><h2>Lv.${level()} ${esc(db.profile.name)} · ${xp()>=1000?'든든한 해결사':xp()>=300?'함께하는 선배':'성장하는 새싹'}</h2><p>동료를 도운 경험이 차곡차곡, 나만의 성장으로.</p><div class="xp-track" role="progressbar" aria-label="다음 레벨 경험치" aria-valuenow="${xp()%100}" aria-valuemin="0" aria-valuemax="100"><i style="width:${xp()%100}%"></i></div><div class="xp-meta"><span>${xp()} XP · 다음 레벨까지 ${100-xp()%100} XP</span><span>${next?next.xp+' XP에 '+next.name+' 해금':'모든 아바타 해금 완료!'}</span></div></div><button class="outline" onclick="go('avatar')">아바타 꾸미기 ↗</button></section>`}
function render(){initGame();baseRender();if($('#role').value==='pending')return;$('#sideName').textContent=db.profile.name;let side=$('.sidebottom .avatar');if(side)side.outerHTML=pixel().replace('class="pixel"','class="avatar pixel"');let nav=$('#nav');nav.insertAdjacentHTML('beforeend',`<button class="${page==='avatar'?'active':''}" onclick="go('avatar')"><span>✦</span><b>나의 아바타</b></button>`);if(page==='home'){let hero=$('.hero');hero.insertAdjacentHTML('afterend',xpPanel());let avatar=$('.profile .avatar');if(avatar)avatar.outerHTML=pixel();$('.progress')?.remove();let txt=$('.profile .small');if(txt)txt.textContent=`Lv.${level()} · ${xp()} XP`; }if(page==='profile')profileView();if(page==='avatar')avatarView()}
function profileView(){let p=db.profile;selectedTags=p.tags.split(',').map(t=>t.trim()).filter(Boolean);$('#app').innerHTML=`<div class="eyebrow">YOUR EXPERIENCE MATTERS</div><h1>나의 업무경험</h1><p>해본 업무를 클릭해서 선택해 주세요. 질문 추천에 바로 반영됩니다.</p><section class="panel" style="max-width:820px"><form id="profileForm"><label>활동 닉네임<input name="nickname" value="${esc(p.name)}" required minlength="2" maxlength="16"></label><span class="nickname-note">게시글과 채팅에는 닉네임이 표시됩니다. 실명은 가입 승인용입니다.</span><label>소속 부서<input name="dept" value="${esc(p.dept)}" required maxlength="80"></label><div><strong>경험한 업무 선택</strong><div id="tagPicker"></div><label>목록에 없는 업무 추가<div style="display:flex;gap:8px"><input id="customTag" maxlength="30" placeholder="업무 태그 입력" style="flex:1;width:0"><button type="button" class="outline" onclick="addTag()">추가</button></div></label></div><label>상세 업무경험<textarea name="experience" maxlength="3000">${esc(p.experience)}</textarea></label><label style="display:flex;align-items:center"><input name="available" type="checkbox" ${p.available?'checked':''}> 멘토링 신청을 받을 수 있어요</label><button class="primary">업무경험 저장</button></form></section>`;renderTagPicker();$('#profileForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),nickname=f.get('nickname').trim();if(nickname.length<2){toast('닉네임은 2자 이상 입력해 주세요.');return}if(!selectedTags.length){toast('업무 태그를 한 개 이상 선택해 주세요.');return}let old=p.name;p.name=nickname;p.dept=f.get('dept').trim();p.tags=selectedTags.join(', ');p.experience=f.get('experience');p.available=f.has('available');db.questions.forEach(q=>{if(q.mine)q.author=nickname;q.applicants=q.applicants.map(n=>n===old?nickname:n)});db.rooms.forEach(r=>{if(r.myRole==='mentor')r.mentor=nickname});save();render();toast('업무경험과 닉네임을 저장했어요.')};$('#customTag').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();addTag()}}}
function renderTagPicker(){let known=Object.values(tagGroups).flat(),groups={...tagGroups};let custom=selectedTags.filter(t=>!known.includes(t));if(custom.length)groups['내가 추가한 업무']=custom;$('#tagPicker').innerHTML=Object.entries(groups).map(([group,tags])=>`<div class="small" style="margin-top:18px">${group}</div><div class="tag-picker">${tags.map(t=>`<button type="button" class="tag-toggle ${selectedTags.includes(t)?'on':''}" aria-pressed="${selectedTags.includes(t)}" data-tag="${esc(t)}">${selectedTags.includes(t)?'✓ ':'＋ '}${esc(t)}</button>`).join('')}</div>`).join('');document.querySelectorAll('[data-tag]').forEach(b=>b.onclick=()=>{let t=b.dataset.tag;selectedTags=selectedTags.includes(t)?selectedTags.filter(x=>x!==t):[...selectedTags,t];renderTagPicker()})}
function addTag(){let el=$('#customTag'),t=el.value.trim();if(!t)return;if(!selectedTags.includes(t))selectedTags.push(t);el.value='';renderTagPicker()}
function avatarView(){let p=db.profile;$('#app').innerHTML=`<div class="eyebrow">A LITTLE HELP, A NEW LOOK</div><h1>나의 도트 아바타</h1><p>나답게 꾸미고, 함께 성장하며 새로운 캐릭터를 만나보세요.</p>${xpPanel()}<div class="customization"><section class="panel"><h3>캐릭터 옷장</h3><div class="wardrobe">${avatarTypes.map(a=>`<button class="avatar-choice ${p.avatar===a.id?'selected':''} ${xp()<a.xp?'locked':''}" data-avatar="${a.id}" ${xp()<a.xp?'disabled':''} aria-pressed="${p.avatar===a.id}">${pixel(a.id,a.color,p.bg,p.accessory)}<strong>${a.name}</strong><small>${xp()<a.xp?'🔒 '+a.xp+' XP에 해금':p.avatar===a.id?'✓ 사용 중':'선택하기'}</small></button>`).join('')}</div></section><section class="panel"><h3>색상과 액세서리</h3><div class="small">옷 색상</div><div class="swatches">${['#83ac74','#648ba8','#b78ba2','#caa766','#9582bb','#536c65'].map(c=>`<button aria-label="옷 색상 ${c}" class="${p.tint===c?'on':''}" style="background:${c}" onclick="setLook('tint','${c}')"></button>`).join('')}</div><div class="small">배경 색상</div><div class="swatches">${['#e8efdf','#e1eaf4','#f4e3ea','#faf0d6'].map(c=>`<button aria-label="배경 색상 ${c}" class="${p.bg===c?'on':''}" style="background:${c}" onclick="setLook('bg','${c}')"></button>`).join('')}</div><div class="small">액세서리</div><div class="tag-picker">${[['none','기본'],['glasses','안경'],['blush','볼터치'],['tie','넥타이']].map(([v,n])=>`<button class="tag-toggle ${p.accessory===v?'on':''}" onclick="setLook('accessory','${v}')">${n}</button>`).join('')}</div><div class="levelrules"><strong>경험치는 이렇게 쌓여요</strong><br>멘토로 참여한 상담 완료: +20 XP<br>100 XP마다 레벨 1 상승 · 상담별 한 번만 지급<br>멘티로 받은 상담과 메시지 수는 경험치에 포함되지 않아요.<br><span class="small">체험: 메시지의 ‘보조금 정산 · 멘토 체험’ 대화에서 완료해 보세요.</span></div></section></div>`;document.querySelectorAll('[data-avatar]').forEach(b=>b.onclick=()=>{let a=avatarTypes.find(a=>a.id===b.dataset.avatar);if(xp()<a.xp)return;p.avatar=a.id;p.tint=a.color;save();render();toast(a.name+'를 선택했어요!')})}
function setLook(key,value){if(!['tint','bg','accessory'].includes(key))return;db.profile[key]=value;save();render()}
function signup(){modal(`<h2>주사님 도와주세요</h2><p class="small">이름과 부서는 관리자 확인용, 활동은 닉네임으로!</p><form id="signup"><label>이름 · 가입 승인용<input name="realName" required maxlength="30"></label><label>소속 부서<input name="dept" required maxlength="80"></label><label>활동 닉네임<input name="nickname" required minlength="2" maxlength="16" placeholder="예: 새싹주사"></label><fieldset class="role-field"><legend>활동 역할 · 중복 선택 가능</legend><div class="role-choices"><label class="role-choice"><input type="checkbox" name="role" value="멘티" checked><span>🌱 멘티<small>궁금한 업무를 질문해요</small></span></label><label class="role-choice"><input type="checkbox" name="role" value="멘토"><span>🌳 멘토<small>업무경험을 나눠요</small></span></label></div></fieldset><div class="small">체험용 가입 신청입니다. 실제 계정은 생성되지 않으며, 아바타는 승인 후 꾸밀 수 있어요.</div><button class="primary">가입 신청</button></form>`);$('#signup').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),nick=f.get('nickname').trim();if(!f.getAll('role').length){toast('멘티 또는 멘토를 하나 이상 선택해 주세요.');return}if(nick.length<2){toast('닉네임은 2자 이상 입력해 주세요.');return}if(db.members.some(m=>(m.nickname||m.name)===nick)||db.profile.name===nick){toast('이미 사용 중인 닉네임입니다.');return}db.members.push({name:f.get('realName').trim(),nickname:nick,dept:f.get('dept').trim(),role:f.getAll('role').join('·'),status:'승인 대기'});save();closeModal();$('#role').value='pending';render()}}
const oldFinish=finish;finish=function(id){oldFinish(id);let form=$('#finish'),original=form.onsubmit;form.onsubmit=e=>{let r=db.rooms.find(r=>r.id===id);if(r.closed){e.preventDefault();return}let grant=r.myRole==='mentor'&&!r.xpGranted;original(e);if(grant){r.xpGranted=true;db.profile.xp+=20;save();toast('+20 XP! 동료를 도와주셔서 감사해요. 새 아바타를 확인하세요.')}}};
const oldChat=renderChat;renderChat=function(){oldChat();let r=db.rooms.find(r=>r.id===roomId);if(r?.myRole==='mentor'){let head=$('.chatroom .sectionhead strong');if(head)head.textContent=r.peer+' 멘티';document.querySelectorAll('.message:not(.mine) small').forEach(el=>{if(el.textContent!=='서비스 안내')el.textContent=r.peer})}};


let adminTab='members',adminStatus='전체',adminCategory='전체',adminQuery='';
const previousRender=render;render=function(){previousRender();if($('#role').value==='pending')return;if(page==='home'){let profile=$('.panel.profile');if(profile){profile.insertAdjacentHTML('beforeend','<button class="primary" style="width:100%;margin-top:10px" onclick="go(\'avatar\')">아바타 꾸미기</button>')}}if(page==='admin'&&$('#role').value==='admin')adminView();let header=$('header>div');if(header&&!$('#guideHelp'))header.insertAdjacentHTML('afterbegin','<button id="guideHelp" class="guide-link" onclick="startGuide()">이용 가이드</button>');};
function adminView(){let qs=db.questions;$('#app').innerHTML=`<div class="eyebrow">ADMINISTRATION</div><h1>관리자 대시보드</h1><p>회원 가입을 승인하고, 멘토링 질문과 매칭 현황을 확인하세요.</p><div class="banner">샘플 및 이 브라우저의 체험 데이터입니다. 실제 회원·질문 전체 집계는 서버 연결 후 제공됩니다.</div><div class="admin-tabs"><button class="${adminTab==='members'?'active':''}" onclick="adminTab='members';adminView()">회원 승인 관리</button><button class="${adminTab==='questions'?'active':''}" onclick="adminTab='questions';adminView()">멘토링 질문 현황</button></div>${adminTab==='members'?`<section class="panel"><div class="sectionhead"><h2>가입 신청 ${db.members.length}명</h2><span class="tag">승인 대기 ${db.members.filter(m=>m.status==='승인 대기').length}명</span></div>${db.members.length?db.members.map((m,i)=>`<div class="member"><span class="avatar">${esc(m.name[0])}</span><div><strong>${esc(m.name)}</strong><p style="margin:5px 0;font-size:12px">${esc(m.dept)} · ${esc(m.role)}${m.nickname?' · 닉네임: '+esc(m.nickname):''}</p></div><span class="tag">${esc(m.status)}</span>${m.status==='승인 대기'?`<div class="actions"><button class="outline" onclick="approve(${i},false)">반려</button><button class="primary" onclick="approve(${i},true)">승인</button></div>`:''}</div>`).join(''):'<div class="empty">가입 신청이 없습니다.</div>'}</section><button class="outline" onclick="resetDemo()">체험 데이터 초기화</button>`:`<div class="stats"><div class="stat"><label>전체 질문</label><strong>${qs.length}<small>건</small></strong></div><div class="stat"><label>멘토 모집 중</label><strong>${qs.filter(q=>q.status==='모집 중').length}<small>건</small></strong></div><div class="stat"><label>진행 중</label><strong>${qs.filter(q=>q.status==='진행 중').length}<small>건</small></strong></div><div class="stat"><label>멘토링 완료</label><strong>${qs.filter(q=>q.status==='완료').length}<small>건</small></strong></div></div><section class="panel"><div class="sectionhead"><h2>질문 및 매칭 현황</h2><button class="outline" onclick="exportQuestions()">CSV 다운로드 ↓</button></div><div class="admin-toolbar"><input aria-label="현황 검색" placeholder="질문 제목 또는 닉네임 검색" value="${esc(adminQuery)}" oninput="adminQuery=this.value;adminRows()"><select aria-label="상태 필터" onchange="adminStatus=this.value;adminRows()">${['전체','모집 중','진행 중','완료'].map(x=>`<option ${adminStatus===x?'selected':''}>${x}</option>`).join('')}</select><select aria-label="분야 필터" onchange="adminCategory=this.value;adminRows()">${categories.map(x=>`<option ${adminCategory===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="small" id="adminCount"></div><div class="table-scroll"><table class="admin-table"><thead><tr><th>질문 제목</th><th>업무 분야</th><th>작성자</th><th>상태</th><th>신청 멘토</th><th>선택 멘토</th><th>등록</th></tr></thead><tbody id="adminRows"></tbody></table></div><p class="small">질문 상세와 1:1 대화는 현황 자료에 포함하지 않습니다.</p></section><section class="panel"><h3>업무 분야별 질문 수</h3>${categories.slice(1).map(c=>{let n=qs.filter(q=>q.category===c).length;return `<div class="small">${c} <strong style="float:right">${n}건</strong></div><div class="admin-category"><i style="width:${qs.length?n/qs.length*100:0}%"></i></div>`}).join('')}</section>`}`;if(adminTab==='questions')adminRows()}
function filteredAdminQuestions(){return db.questions.filter(q=>(adminStatus==='전체'||q.status===adminStatus)&&(adminCategory==='전체'||q.category===adminCategory)&&(q.title+' '+q.author+' '+(q.mentor||'')).includes(adminQuery))}
function adminRows(){if($('#role').value!=='admin')return;let list=filteredAdminQuestions();$('#adminCount').textContent=`조회 ${list.length}건 / 전체 ${db.questions.length}건`;$('#adminRows').innerHTML=list.length?list.map(q=>`<tr><td>${esc(q.title)}</td><td>${esc(q.category)}</td><td>${esc(q.author)}</td><td><span class="tag">${esc(q.status)}</span></td><td>${q.applicants.length}명</td><td>${esc(q.mentor||'미매칭')}</td><td>${esc(q.date)}</td></tr>`).join(''):'<tr><td colspan="7" class="empty">조건에 맞는 질문이 없습니다.</td></tr>'}
function exportQuestions(){if($('#role').value!=='admin')return;let rows=[['질문 제목','업무 분야','작성자 닉네임','상태','신청 멘토 수','선택 멘토','등록'],...filteredAdminQuestions().map(q=>[q.title,q.category,q.author,q.status,q.applicants.length,q.mentor||'',q.date])];let csv='\ufeff'+rows.map(row=>row.map(v=>'"'+String(v).replace(/^[=+@\-]/,"'$&").replace(/"/g,'""')+'"').join(',')).join('\r\n');let url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'})),a=document.createElement('a');a.href=url;a.download='멘토링_질문현황.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
let guideIndex=0,guideOpener=null;const guideSteps=[{page:'home',target:'.heading',title:'처음이 낯설 때, 함께 시작해요',body:'이곳은 공직 업무를 묻고 경험을 나누는 공간이에요. 멘티로 질문하고, 익숙한 업무에서는 멘토가 될 수 있어요.'},{page:'home',target:'.heading .primary',title:'궁금한 업무를 질문해요',body:'업무 분야와 제목, 상세 질문을 작성하세요. 상세 내용은 작성자와 선택된 멘토만 화면에서 확인할 수 있어요.'},{page:'profile',target:'#tagPicker',title:'해본 업무를 클릭해 주세요',body:'경험한 업무 태그는 여러 개 선택할 수 있어요. 저장하면 관련 질문을 우선 추천해 드려요.'},{page:'mine',target:'#list',title:'멘토 신청을 보고 선택해요',body:'내 질문에 멘토가 신청하면 한 명을 선택하세요. 질문을 선택한 뒤 ‘멘토 선택’을 누르면 대화방이 생겨요.'},{page:'chat',target:'.chatlayout',title:'매칭된 동료와 이야기해요',body:'질문을 자세히 나누고 도움을 주고받으세요. 멘토로 참여한 상담을 완료하면 20 XP가 한 번 지급돼요.'},{page:'avatar',target:'.wardrobe',title:'경험이 쌓이면 새 캐릭터가 열려요',body:'옷·배경 색상과 액세서리를 꾸미고, 경험치를 모아 새로운 도트 아바타를 해금해 보세요.'},{page:'home',target:'.panel.profile',title:'준비됐어요! 이제 함께 시작해요',body:'프로필의 ‘아바타 꾸미기’에서 내 캐릭터를 바꿀 수 있어요. 안내가 필요하면 상단 ‘이용 가이드’를 다시 누르세요.'}];
function startGuide(){if($('#role').value==='pending'){modal('<h2>먼저 가입 승인이 필요해요</h2><p>승인이 완료된 후 질문 등록과 멘토링을 이용할 수 있어요. 체험 역할을 멘토·멘티로 바꾸면 이용 가이드를 볼 수 있습니다.</p>');return}closeModal();guideOpener=document.activeElement;guideIndex=0;showGuide()}
function showGuide(){document.querySelector('#guideRoot')?.remove();let step=guideSteps[guideIndex];page=step.page;render();let target=$(step.target);target?.scrollIntoView({block:'center',behavior:'instant'});let root=document.createElement('div');root.id='guideRoot';root.innerHTML=`<div style="position:fixed;inset:0;z-index:99" aria-hidden="true"></div><div class="guide-focus" aria-hidden="true"></div><section class="guide-box" role="dialog" aria-modal="true" aria-labelledby="guideTitle"><button class="guide-close" aria-label="가이드 닫기" onclick="endGuide()">×</button><div class="guide-step">처음 이용 가이드 · ${guideIndex+1} / ${guideSteps.length}</div><h2 id="guideTitle">${step.title}</h2><p>${step.body}</p><div class="guide-dots">${guideSteps.map((_,i)=>`<i class="${i===guideIndex?'on':''}"></i>`).join('')}</div><div class="guide-controls"><button class="small" onclick="endGuide()">나중에 볼게요</button>${guideIndex?'<button class="outline" onclick="guideIndex--;showGuide()">이전</button>':''}<button class="primary" onclick="${guideIndex===guideSteps.length-1?'endGuide()':'guideIndex++;showGuide()'}">${guideIndex===guideSteps.length-1?'시작하기':'다음 →'}</button></div></section>`;document.body.appendChild(root);positionGuide();$('#guideRoot .primary').focus()}
function positionGuide(){let root=$('#guideRoot');if(!root)return;let target=$(guideSteps[guideIndex].target),r=target?.getBoundingClientRect(),focus=$('#guideRoot .guide-focus'),box=$('#guideRoot .guide-box'),vw=window.innerWidth,vh=window.innerHeight;if(!r||!r.width){focus.style.display='none';box.style.left=Math.max(14,(vw-box.offsetWidth)/2)+'px';box.style.top=Math.max(14,(vh-box.offsetHeight)/2)+'px';return}let left=Math.max(4,r.left-5),top=Math.max(4,r.top-5),w=Math.min(r.width+10,vw-left-4),h=Math.min(r.height+10,vh-top-4);Object.assign(focus.style,{left:left+'px',top:top+'px',width:w+'px',height:h+'px'});let bx=Math.min(Math.max(14,left),vw-box.offsetWidth-14),by=top+h+14;if(by+box.offsetHeight>vh-14)by=top-box.offsetHeight-14;if(by<14){bx=Math.min(Math.max(14,left+w+16),vw-box.offsetWidth-14);by=Math.max(14,Math.min(top,vh-box.offsetHeight-14))}box.style.left=bx+'px';box.style.top=by+'px'}
function endGuide(){document.querySelector('#guideRoot')?.remove();localStorage.setItem('jusa-guide-v1','seen');page='home';render();window.scrollTo({top:0});$('#guideHelp')?.focus()}
window.addEventListener('resize',positionGuide);window.addEventListener('scroll',positionGuide,true);document.addEventListener('keydown',e=>{let root=$('#guideRoot');if(!root)return;if(e.key==='Escape'){e.preventDefault();endGuide()}if(e.key==='Tab'){let buttons=[...root.querySelectorAll('button')];let first=buttons[0],last=buttons[buttons.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
initGame();$('#role').onchange=render;render();if(!localStorage.getItem('jusa-guide-v1')&&$('#role').value!=='pending')startGuide();
</script></body></html>
